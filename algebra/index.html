<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algebraic: Unit 1 Test Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FC; --ink:#141B2D; --ink2:#434C63; --muted:#6F7990;
  --rule:#E3E8F1; --rule2:#C9D1DF;
  --a:#E0368F; --a-ink:#C21F76; --b:#F29A0E; --b-ink:#A35D00;
  --h:#2172E8; --h-ink:#1A5FC4; --k:#8448EF; --k-ink:#6F35D6;
  --c1:#2172E8; --c1i:#1A5FC4; --c2:#8448EF; --c2i:#6F35D6; --c3:#E0368F; --c3i:#C21F76;
  --c4:#EC8F0B; --c4i:#A35D00; --c5:#0E9C8E; --c5i:#0A7A6F; --c6:#5E9A0C; --c6i:#487708;
  --good:#139A52; --good-bg:#E3F5EA; --bad:#E1463B; --bad-bg:#FCEBE9;
  --ui:'Bricolage Grotesque', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --math:'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ui);font-size:17px;line-height:1.5;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(rgba(33,114,232,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(33,114,232,.055) 1px,transparent 1px);
  background-size:26px 26px;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--h);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.015em}
p{margin:0}
sup{font-size:.62em;line-height:0}
.m{font-family:var(--math);font-style:normal}
.m i,i.v{font-family:var(--math);font-style:italic}
.pa{color:var(--a-ink);font-weight:600}.pb{color:var(--b-ink);font-weight:600}.ph{color:var(--h-ink);font-weight:600}.pk{color:var(--k-ink);font-weight:600}
.frac{display:inline-flex;flex-direction:column;vertical-align:.72em;font-size:.64em;line-height:1;text-align:center;margin:0 .08em}
.frac>span:first-child{border-bottom:.1em solid currentColor;padding:0 .14em}
.rad{border-top:.07em solid currentColor;padding:0 .1em;margin-left:.02em}
.muted{color:var(--muted)}
.hl{background:#FFF1D0;border-radius:4px;padding:0 .15em}

/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 22px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--rule)}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font:800 22px/1 var(--ui);letter-spacing:-.035em;border-radius:8px}
.brand svg{width:32px;height:32px;flex:none}
.hud{margin-left:auto;display:flex;align-items:center;gap:12px}
.xp{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.xp .bar{width:118px;height:10px;border-radius:99px;background:var(--rule);overflow:hidden;position:relative}
.xp .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,var(--c1) 0 16.6%,var(--c2) 16.6% 33.3%,var(--c3) 33.3% 50%,var(--c4) 50% 66.6%,var(--c5) 66.6% 83.3%,var(--c6) 83.3% 100%);background-size:118px 100%}
.streak{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;color:var(--muted);padding:5px 10px;border-radius:99px;border:1.5px solid var(--rule)}
.streak svg{width:17px;height:17px;fill:currentColor}
.streak.hot{color:var(--b-ink);border-color:var(--b);background:#FFF5E3}
.iconbtn{all:unset;cursor:pointer;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--rule)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:hover,.textbtn:hover{border-color:var(--rule2);background:#fff}
.textbtn{all:unset;cursor:pointer;font-weight:600;font-size:15px;padding:8px 13px;border-radius:10px;border:1.5px solid var(--rule);white-space:nowrap}
.textbtn .sm{display:none}
.home-btn .sm svg{width:18px;height:18px;display:block;fill:none;stroke:var(--ink);stroke-width:2}

/* buttons */
.btn{cursor:pointer;font-weight:700;font-size:16px;padding:.68em 1.25em;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s}
.btn:hover{background:#F2F5FB}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
.btn.primary:hover{background:#26304A}
.btn.ghost{border-color:var(--rule2);box-shadow:0 3px 0 var(--rule2);color:var(--ink2)}
.btn.sm{font-size:14px;padding:.5em .95em}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
.actions.center{justify-content:center}
.linkbtn{all:unset;cursor:pointer;color:var(--h-ink);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px;border-radius:4px}

/* home */
.home{max-width:1180px;margin:0 auto;padding:34px 28px 90px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:14px 0 40px}
.hero h1{font-size:clamp(46px,6.6vw,86px);font-weight:800;line-height:.98;letter-spacing:-.045em}
.hero h1 span{display:block;color:var(--muted)}
.hero-lede{font-size:21px;line-height:1.45;color:var(--ink2);max-width:30em;margin-top:24px}
.chaps{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chaps span{font-size:14px;font-weight:700;padding:5px 11px;border-radius:99px;border:2px solid var(--cc);color:var(--ink2);background:#fff;transition:all .35s}
.chaps span.on{background:var(--cc);color:#fff;transform:translateY(-2px)}
.hero .actions{margin-top:28px}
.hero-cap{text-align:center;font-size:21px;margin-top:8px;min-height:1.6em}
.chapter{margin-top:46px;display:grid;grid-template-columns:260px 1fr;gap:26px;align-items:start}
.ch-head .num{font:800 58px/1 var(--ui);color:var(--cc);letter-spacing:-.04em}
.ch-head h2{font-size:26px;font-weight:800;margin-top:6px}
.ch-head p{color:var(--muted);font-size:15px;margin-top:4px}
.ch-head .qs{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--cci);background:#fff;border:1.5px solid var(--cc);border-radius:99px;padding:2px 10px}
.trail{list-style:none;margin:0;padding:12px 0 0;display:flex;flex-wrap:wrap;gap:14px 10px;position:relative}
.trail li{position:relative;display:flex;align-items:center}
.trail li+li::before{content:"";width:18px;border-top:3px dashed var(--rule2);margin-right:10px}
.node{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:14px;padding:2px}
.node .pill{min-width:74px;height:56px;padding:0 14px;border-radius:16px;display:grid;place-items:center;background:#fff;border:3px solid var(--cc);box-shadow:0 4px 0 var(--cc);font:800 18px/1 var(--ui);color:var(--ink);transition:transform .2s;white-space:nowrap}
.node.lesson .pill{border-radius:50%;min-width:56px;width:56px;padding:0}
.node.lesson .pill svg{width:24px;height:24px;fill:none;stroke:var(--cci);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.node:hover .pill{transform:translateY(-3px)}
.node.cleared .pill{background:var(--cc);color:#fff}
.node.cleared .pill svg{stroke:#fff}
.node.next .pill{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.node .nt{font-size:13px;font-weight:600;color:var(--ink2);max-width:120px;text-align:center;line-height:1.2}
.stars{display:inline-flex;gap:1px}
.stars svg{width:14px;height:14px;fill:var(--rule2)}
.stars svg.on{fill:var(--b)}
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.qtile{all:unset;cursor:pointer;height:50px;border-radius:12px;display:grid;place-items:center;background:#fff;border:2px solid var(--rule2);font:800 18px/1 var(--ui);position:relative;box-shadow:0 3px 0 var(--rule2)}
.qtile:hover{border-color:var(--cc)}
.qtile.done{border-color:var(--cc);background:var(--cc);color:#fff;box-shadow:0 3px 0 var(--cc)}
.qtile::after{content:"";position:absolute;left:8px;right:8px;bottom:5px;height:3px;border-radius:3px;background:var(--cc);opacity:.7}
.qtile.done::after{background:#fff;opacity:.45}
.speed{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;padding:24px 28px;border:2px dashed var(--rule2);border-radius:18px;background:rgba(255,255,255,.75);margin-top:46px}
.speed h2{font-size:26px;font-weight:800}
.speed p{color:var(--ink2);max-width:36em}
.section-h{font-size:26px;font-weight:800;margin:54px 0 14px}

/* sheets + graph */
.sheetwrap{position:relative}
.sheetwrap::before{content:"";position:absolute;inset:0;background:#fff;border:1.5px solid var(--rule2);border-radius:6px;transform:rotate(1.6deg) translate(7px,6px)}
.sheet{position:relative;background:#fff;border:1.5px solid var(--rule2);border-radius:6px;padding:12px}
svg.graph{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
svg.graph.plotting{cursor:crosshair}
.gl{stroke:#E6EAF2;stroke-width:1}.gl.maj{stroke:#CCD4E2}
.axis{stroke:var(--ink);stroke-width:2}.axhead{fill:var(--ink)}
.tick{font:600 16px var(--ui);fill:var(--ink2);paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.curve-parent{fill:none;stroke:#9CA6B8;stroke-width:3.2;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}
.curve-main{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.curve-given{fill:none;stroke:var(--ink2);stroke-width:4;stroke-linecap:round}
.curve-inv{fill:none;stroke:var(--c3);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.mirror{fill:none;stroke:var(--c3);stroke-width:2.5;stroke-dasharray:4 7;stroke-linecap:round;opacity:.75}
.piece{fill:none;stroke:var(--c5);stroke-width:4.5;stroke-linecap:round}
.piece-head{fill:var(--c5)}
.given-head{fill:var(--ink2)}
.dot-closed{fill:var(--c5);stroke:var(--c5);stroke-width:3}
.dot-open{fill:#fff;stroke:var(--c5);stroke-width:3.5}
.pt-parent{fill:#fff;stroke:#9CA6B8;stroke-width:3}
.pt-u{fill:var(--ink);stroke:#fff;stroke-width:2.5}
.pt-f{fill:var(--ink2);stroke:#fff;stroke-width:2.5}
.pt-inv{fill:var(--c3);stroke:#fff;stroke-width:2.5}
.pt-u.glow{animation:glow 1.1s ease-out}
@keyframes glow{0%{fill:var(--ink)}30%{fill:var(--good);stroke:var(--good);stroke-width:10;stroke-opacity:.35}100%{fill:var(--good);stroke:#fff;stroke-width:2.5}}
.pt-u.glowed{fill:var(--good)}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.fly{fill:var(--h)}
.trail-l{fill:none;stroke:var(--h);stroke-width:3;stroke-linecap:round;opacity:.5;transition:opacity .7s}
.trail-l.fade{opacity:0}
.ring-bad{fill:none;stroke:var(--bad);stroke-width:3.5;transform-box:fill-box;transform-origin:center;animation:ring .55s ease-out forwards}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(2);opacity:0}}
.hv-ring{fill:rgba(33,114,232,.12);stroke:var(--h);stroke-width:2.5;pointer-events:none}
.hv-text{font:700 18px var(--ui);fill:var(--h-ink);paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;pointer-events:none}
.glabel{font:italic 600 24px var(--math);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
.glabel.parent{fill:#7D879B}.glabel.inv{fill:var(--c3i)}.glabel.piece{fill:var(--c5i)}

/* level */
.lvl-head{max-width:1260px;margin:0 auto;padding:22px 28px 0;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;padding:8px 12px 8px 8px;border-radius:10px;border:1.5px solid var(--rule2);background:#fff}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lvl-title .eyeline{font-size:14px;font-weight:700;color:var(--cci)}
.formchip{display:inline-block;white-space:nowrap;font-size:12px;font-weight:800;letter-spacing:.02em;padding:3px 9px;border-radius:99px;color:#fff;background:var(--fc,var(--ink));margin-left:8px;vertical-align:2px}
.board .formchip{flex:none;margin-left:0}
.lvl-title .formchip{margin-left:0;margin-top:4px}
.lvl-title h2{font-size:28px;font-weight:800}
.stepper{margin-left:auto;display:flex;list-style:none;padding:0;gap:6px;flex-wrap:wrap}
.stepper li{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--rule2);background:#fff;transition:all .3s}
.stepper li.done{background:var(--good);border-color:var(--good)}
.stepper li.cur{background:var(--ink);border-color:var(--ink);transform:scale(1.2)}
.lvl-body{max-width:1260px;margin:0 auto;padding:22px 28px 90px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.stage{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow-x:hidden;overflow-y:auto;padding:2px 12px 14px 2px}
.panel{min-width:0}
.scr{animation:scrIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(12px)}}
.scr h3{font-size:25px;font-weight:800;margin-bottom:8px}
.scr h4{font-size:18px;font-weight:700;margin:20px 0 8px}
.lede{color:var(--ink2);font-size:18px;max-width:38em}
.lede+.lede{margin-top:10px}
.lede .m,.fb .m,.hint .m,.opt .m,.note-card .m{font-size:1.18em}
.big{font-size:40px;line-height:1.3;margin:16px 0 4px;padding:6px 0 12px;border-bottom:2px solid var(--rule)}
.note-card{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff;border:1.5px solid var(--rule2)}
.note-card p+p{margin-top:8px}
.rulebox{margin:14px 0;padding:14px 18px;border-radius:14px;background:#fff;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.rulebox .m{font-size:26px;display:block;line-height:1.4}
/* piecewise function written with a real brace */
.pwd{display:inline-flex;align-items:center;gap:.2em;font-family:var(--math);vertical-align:middle}
.pwd-brace{font-size:calc(var(--n,2) * 1.05em);line-height:1;font-weight:400;transform:scaleX(.55);margin:0 -.1em}
.pwd-rows{display:grid;grid-template-columns:auto auto;gap:.08em .7em;font-size:.78em;line-height:1.3}
.pwd-rows .c{color:var(--ink2)}

/* ponder: one short line at a time, the graph shows it */
.pz{display:flex;flex-direction:column;gap:16px}
.pz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pz-scene{font-size:14px;font-weight:800;color:var(--cci,var(--muted));letter-spacing:.06em;text-transform:uppercase}
.pz-eq{font-family:var(--math);font-size:36px;line-height:1.35;padding:20px 18px 14px;border-radius:16px;background:#fff;border:2px solid var(--rule2);text-align:center;overflow-x:auto}
.pz-eq .pwd-rows{font-size:.8em}
.pz-eq [data-k]{position:relative;display:inline-block;border-radius:8px;padding:0 .06em;transition:background .25s,box-shadow .25s,color .25s}
.pz-eq [data-k].lit{background:#FFE7B8;box-shadow:0 0 0 .12em #FFE7B8;color:var(--b-ink)}
.pz-eq [data-k].lit::after{content:"";position:absolute;left:50%;top:-.62em;border:.2em solid transparent;border-top:.3em solid var(--b);transform:translateX(-50%);animation:pzbob .9s ease-in-out infinite}
@keyframes pzbob{50%{transform:translate(-50%,-.18em)}}
.pz-say{font-size:32px;font-weight:800;line-height:1.25;letter-spacing:-.015em;min-height:2.6em;margin:0}
.pz-say .w{display:inline-block;opacity:0;transform:translateY(10px);animation:pzw .38s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pzw{to{opacity:1;transform:none}}
.pz-say .m{font-size:1.08em}
.pz-bar{height:5px;border-radius:5px;background:var(--rule);overflow:hidden}
.pz-bar i{display:block;height:100%;width:0;background:var(--cc,var(--ink))}
.pz-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pz-ctrl .iconbtn{width:48px;height:48px;border-radius:12px;background:#fff}
.pz-ctrl .iconbtn.main{background:var(--ink)}
.pz-ctrl .iconbtn.main svg{stroke:#fff;fill:#fff}
.pz-dots{display:flex;gap:7px;flex-wrap:wrap;margin-left:6px}
.pz-dots button{all:unset;cursor:pointer;width:12px;height:12px;border-radius:50%;background:var(--rule);transition:all .25s}
.pz-dots button.done{background:var(--cc,var(--ink2));opacity:.55}
.pz-dots button.cur{background:var(--cc,var(--ink));transform:scale(1.4)}
.pz-ptr{pointer-events:none}
.pz-ptr .ring{fill:none;stroke:var(--b);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pzring 1.2s ease-out infinite}
@keyframes pzring{from{transform:scale(.6);opacity:1}to{transform:scale(2);opacity:0}}
.pz-ptr .arrow{fill:var(--b);stroke:#fff;stroke-width:2.5;stroke-linejoin:round;animation:pzarrow .9s ease-in-out infinite}
@keyframes pzarrow{50%{transform:translateY(-7px)}}
.pz-ptr.up .arrow{animation-name:pzarrowup}
@keyframes pzarrowup{50%{transform:translateY(7px)}}

/* ponder extras: a work line and a table that fills in */
.pz-work{font-size:28px;line-height:1.4;text-align:center;min-height:1.4em;padding:2px 6px}
.pz-work:empty{display:none}
.pz-work .frac{font-size:.7em}
.hi{background:#FFE7B8;border-radius:6px;box-shadow:0 0 0 .1em #FFE7B8;color:var(--b-ink)}
.pz-tbl:empty{display:none}
.pz-t{border-collapse:separate;border-spacing:0;margin:0 auto;background:#fff;border:1.5px solid var(--rule2);border-radius:12px;overflow:hidden;font-size:20px}
.pz-t th{font:italic 600 21px var(--math);padding:6px 12px;background:#F3F6FB;border-bottom:1px solid var(--rule)}
.pz-t tr:first-child td{color:var(--ink2);background:#FAFBFD;border-bottom:1px solid var(--rule)}
.pz-t td{min-width:46px;height:38px;padding:4px 8px;text-align:center;font-weight:700;border-left:1px solid var(--rule);transition:background .25s}
.pz-t td.lit{background:#FFF1D0}
.pz-t td.pop{animation:pzcell .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pzcell{0%{transform:scale(.4);color:var(--b-ink)}100%{transform:none}}
.pz-ctrl .iconbtn.ready{animation:pzready 1.4s ease-in-out infinite}
.pz-quiz:empty{display:none}
.pz-quiz{padding:14px 16px;border-radius:16px;background:#fff;border:2px solid var(--cc,var(--ink));box-shadow:0 4px 0 var(--cc,var(--ink))}
.pz-qtag{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cci,var(--ink2));margin-bottom:8px}
.pz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pz-opts .opt{font-size:19px;text-align:center;justify-content:center}
.pz-qfb{margin-top:10px;font-size:16px;line-height:1.45}
.pz-qfb:empty{display:none}
.pz-qfb.good{color:var(--good);font-weight:800}
.pz-qfb.bad{color:var(--bad);font-weight:600}
@media (max-width:520px){.pz-opts{grid-template-columns:1fr}}
/* help on every question step */
.helpbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:22px;padding-top:14px;border-top:1.5px dashed var(--rule2)}
.helpbar.later{display:none}
.helpbar.nudge{animation:hbnudge .9s ease-out}
@keyframes hbnudge{0%{background:#FFF1D0}100%{background:transparent}}
.hb-lbl{font-size:14px;font-weight:700;color:var(--muted)}
.hbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:700;padding:7px 13px;border-radius:99px;border:2px solid var(--rule2);background:#fff;color:var(--ink2)}
.hbtn:hover{border-color:var(--ink2);color:var(--ink)}
.hbtn .qm{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px}
/* the pop-up player for examples and "where was this taught" */
.hp{z-index:95;align-items:start;overflow:auto}
.hp-card{width:min(1180px,100%);background:var(--paper);border-radius:22px;border:2px solid var(--ink);box-shadow:0 8px 0 var(--ink);padding:16px 20px 22px;animation:cardIn .4s cubic-bezier(.3,1.5,.5,1)}
.hp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hp-head b{font-size:18px;font-weight:800}
.hp-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.hp-body{grid-template-columns:1fr}.hp-stage{order:-1}.hp-stage svg.graph{max-height:38vh;width:auto;margin:0 auto}}
@keyframes pzready{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--cc,var(--ink)) 28%,transparent)}}

/* intervals typed like on paper */
.ivl{display:flex;flex-direction:column;gap:6px}
.ivl-row{display:flex;align-items:center;gap:6px;font:600 28px var(--math)}
.ivl-b{all:unset;cursor:pointer;width:40px;height:52px;display:grid;place-items:center;border-radius:10px;border:2px solid var(--rule2);background:#fff;font:600 32px var(--math);box-shadow:0 3px 0 var(--rule2)}
.ivl-b:hover{border-color:var(--ink2)}
.ivl-b:active{transform:translateY(2px);box-shadow:none}
.ivl.ok .ivl-b,.ivl.ok input.num{border-color:var(--good);background:var(--good-bg)}
.ivl.bad .ivl-b,.ivl.bad input.num{border-color:var(--bad);background:var(--bad-bg)}
.ivl-quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.ivl-inf{all:unset;cursor:pointer;padding:4px 12px;border-radius:8px;border:1.5px solid var(--rule2);background:#fff;font:600 17px var(--math)}

/* the mastery map */
.mastery{margin-top:34px}
.mastery>h2{font-size:28px;font-weight:800}
.mastery>p{color:var(--ink2);max-width:44em;margin-top:6px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.mcard{background:#fff;border:2px solid var(--rule2);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mcard.mastered{border-color:var(--cc,var(--good));box-shadow:0 4px 0 var(--cc,var(--good))}
.mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mhead b{font-size:18px;font-weight:800}
.mok{margin-left:auto;font-size:13px;font-weight:800;color:var(--good)}
.mq{font-size:21px;line-height:1.35;overflow-x:auto}
.mpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.mpill{all:unset;cursor:pointer;font-size:14px;font-weight:700;padding:7px 12px;border-radius:99px;border:2px solid var(--rule2);color:var(--ink2);background:#fff}
.mpill:hover{border-color:var(--ink2)}
.mpill.done{background:var(--cc,var(--good));border-color:var(--cc,var(--good));color:#fff}
.mpill.next{border-color:var(--cc,var(--ink));color:var(--cci,var(--ink));box-shadow:0 0 0 3px color-mix(in srgb,var(--cc,var(--ink)) 22%,transparent);animation:bob 1.8s ease-in-out infinite}
.mcard.final{grid-column:1/-1;--cc:var(--ink);--cci:var(--ink)}
.slips{margin:10px 0 0;padding-left:22px;color:var(--ink2);display:grid;gap:4px}

/* practice mode */
.solved{margin-top:6px;padding:18px 20px;border-radius:16px;background:#fff;border:2px solid var(--good);box-shadow:0 4px 0 var(--good)}
.solved h3{font-size:24px;margin-bottom:4px}

/* board */
.board .qrow{display:flex;gap:12px;align-items:baseline;padding:4px 4px 10px;border-bottom:1.5px solid var(--rule)}
.board .qtag{flex:none;font:800 15px/1 var(--ui);color:#fff;background:var(--cc,var(--ink));border-radius:8px;padding:6px 8px}
.board .qtext{font-size:18px;color:var(--ink2)}
.board .qtext .m{font-size:1.25em;color:var(--ink)}
.board .slot:empty{display:none}
.board .slot{padding:12px 4px 4px}
.board .ghost:empty{display:none}
.board .ghost{padding-top:8px}
.work{list-style:none;margin:0;padding:6px 4px 2px}
.work:empty::before{content:"Your worked solution builds here as you go.";display:block;color:var(--muted);font-size:15px;padding:12px 0 6px}
.work li{font-family:var(--math);font-size:23px;line-height:1.45;padding:3px 0 3px 12px;border-left:3px solid var(--rule);animation:workIn .5s cubic-bezier(.2,.8,.2,1)}
.work li.head{font-family:var(--ui);font-size:15px;font-weight:700;color:var(--muted);border-left-color:transparent;padding-left:0;margin-top:10px}
.work li.ans{border-left-color:var(--good);background:linear-gradient(90deg,var(--good-bg),transparent 80%)}
.work li .u{font-family:var(--ui);font-size:15px;color:var(--muted)}
@keyframes workIn{from{opacity:0;transform:translateX(-10px);background:#FFF3CF}}

/* fields */
.fields{display:flex;flex-wrap:wrap;gap:14px 18px;margin-top:18px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field .fl{font-size:17px;color:var(--ink2)}
.field .fl .m{font-size:1.25em;color:var(--ink)}
.field.inline{flex-direction:row;align-items:center;gap:8px}
input.num{width:110px;min-width:0;font:600 22px/1 var(--ui);text-align:center;color:var(--ink);background:#fff;border:2px solid var(--rule2);border-bottom:4px solid var(--c,var(--rule2));border-radius:11px;padding:10px 6px;transition:border-color .15s,background .2s,box-shadow .15s}
input.num.wide{width:min(340px,78vw);text-align:left;padding-left:12px;font-size:21px}
input.num.sm{width:84px;font-size:19px;padding:7px 4px;border-bottom-width:3px}
input.num:focus{outline:none;border-color:var(--c,var(--h));box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--h)) 18%,transparent)}
input.num.ok,.ok>input.num{background:var(--good-bg);border-color:var(--good)}
input.num.bad,.bad>input.num{background:var(--bad-bg);border-color:var(--bad)}
input.num.almost{background:#FFF7E3;border-color:var(--b)}
input.num[readonly]{cursor:default}
.preview{font-size:15px;color:var(--muted);min-height:1.4em}
.preview .m{font-size:1.3em;color:var(--ink)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.keys button{all:unset;cursor:pointer;min-width:38px;height:38px;display:grid;place-items:center;border-radius:9px;border:1.5px solid var(--rule2);background:#fff;font:600 18px var(--math);box-shadow:0 2px 0 var(--rule2)}
.keys button:active{transform:translateY(2px);box-shadow:none}
.tog{display:inline-flex;border:1.5px solid var(--rule2);border-radius:11px;padding:3px;background:#fff;gap:3px}
.tog button{all:unset;cursor:pointer;padding:7px 12px;border-radius:8px;font-size:15px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tog button svg{width:16px;height:16px}
.tog button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tog.ok{border-color:var(--good);background:var(--good-bg)}
.tog.bad{border-color:var(--bad);background:var(--bad-bg)}
.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* feedback */
.fb{display:none;margin-top:18px;padding:13px 16px;border-radius:12px;font-size:16px;line-height:1.45;border-left:5px solid}
.fb.show{display:block}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.info{background:#EEF4FE;border-color:var(--h)}
.fb.almost{background:#FFF7E3;border-color:var(--b)}
.hints:empty{display:none}
.hints{margin-top:16px;display:grid;gap:8px}
.hint{padding:11px 14px;border-radius:12px;background:#FFF7E8;border:1.5px dashed var(--b);font-size:16px}

/* choices */
.opts{display:grid;gap:9px;margin-top:14px}
.opts.cols2{grid-template-columns:1fr 1fr}
.opts.cols3{grid-template-columns:repeat(3,1fr)}
.opts.cols4{grid-template-columns:repeat(4,1fr)}
.opt{all:unset;cursor:pointer;padding:12px 16px;border-radius:12px;border:2px solid var(--rule2);background:#fff;box-shadow:0 3px 0 var(--rule2);font-size:18px;line-height:1.35;transition:border-color .15s}
.opt .m{font-size:1.3em}
.opt:hover{border-color:var(--ink2)}
.opt.ok{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);opacity:.75;cursor:default}
.opt.dim{opacity:.4;cursor:default}
.opt.big1{text-align:center;font:italic 600 40px var(--math);padding:14px}
.opt.card{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px}
.opt.card svg{width:100%;max-width:120px;height:auto}
.opt.card span{font-size:15px;font-weight:700}

/* chips */
.tray{list-style:none;counter-reset:mv;margin:18px 0 0;padding:12px;min-height:66px;border-radius:14px;border:2px dashed var(--rule2);background:rgba(255,255,255,.6);display:flex;flex-direction:column;gap:8px}
.tray:empty::before{content:attr(data-empty);color:var(--muted);font-size:15px;padding:8px 6px}
.tray .chip{counter-increment:mv;width:100%;text-align:left}
.tray .chip::after{content:counter(mv);position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);font-weight:800}
.pool{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.chip{position:relative;cursor:pointer;font-weight:600;font-size:16px;line-height:1.25;padding:.6em 2.2em .6em 1.7em;border-radius:12px;border:2px solid var(--rule2);background:#fff;box-shadow:0 3px 0 var(--rule2);transition:background .2s,border-color .2s}
.pool .chip{padding-right:1em}
.chip::before{content:"";position:absolute;left:.7em;top:50%;width:.5em;height:.5em;border-radius:50%;background:var(--c,var(--ink2));transform:translateY(-50%)}
.chip:hover{border-color:var(--ink2)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad)}
.chip.ok{background:var(--good-bg);border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.chip.lit{background:#FFF5DE;border-color:var(--b);box-shadow:0 3px 0 var(--b)}
.chip:disabled{cursor:default}

/* tables */
table.tt{border-collapse:separate;border-spacing:0;margin-top:14px;background:#fff;border:1.5px solid var(--rule2);border-radius:12px;overflow:hidden;width:100%;max-width:480px}
.tt th{font:italic 600 21px var(--math);padding:8px 6px;background:#F3F6FB;border-bottom:1.5px solid var(--rule2)}
.tt td{padding:6px;text-align:center;border-bottom:1px solid var(--rule);font-size:19px;font-weight:600}
.tt tr:last-child td{border-bottom:0}
.tt td.given{color:var(--muted)}
.tt td.note{font-size:12px;color:var(--muted);font-weight:600;width:60px}
.tt tr.ok td{background:var(--good-bg)}
.tt tr.ok td.note{color:var(--good)}
.tt .sep{border-left:1.5px solid var(--rule2)}
.tt input.num{width:100%;max-width:96px}

/* widgets */
.machine{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mach{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 16px 10px;border-radius:16px;background:#fff;border:2.5px solid var(--cc,var(--c1));box-shadow:0 4px 0 var(--cc,var(--c1));min-width:120px}
.mach .mn{font:italic 600 26px var(--math)}
.mach .mr{font-size:15px;color:var(--ink2)}
.mach .mr .m{font-size:1.2em}
.bubble{min-width:58px;height:50px;padding:0 12px;border-radius:25px;display:grid;place-items:center;background:#F3F6FB;border:2px dashed var(--rule2);font:700 22px var(--ui);transition:all .3s}
.bubble.full{background:#fff;border:2px solid var(--ink);border-style:solid}
.bubble.out.full{background:var(--good-bg);border-color:var(--good)}
.pipe{width:26px;height:4px;border-radius:4px;background:var(--rule2);position:relative;overflow:hidden}
.pipe i{position:absolute;inset:0;background:var(--cc,var(--c1));transform:translateX(-100%)}
.pipe.run i{animation:pipe .5s ease-in forwards}
@keyframes pipe{to{transform:translateX(0)}}
.token{position:fixed;z-index:60;pointer-events:none;font:800 20px var(--ui);background:var(--ink);color:#fff;border-radius:99px;padding:6px 12px;transform:translate(-50%,-50%)}
.pwrap{display:grid;gap:8px;margin-top:14px}
.prow{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:10px 14px;border-radius:12px;border:2px solid var(--rule2);background:#fff;box-shadow:0 3px 0 var(--rule2)}
.prow .m{font-size:23px}
.prow .cond{font-family:var(--math);font-size:20px;color:var(--ink2)}
.prow.ok{border-color:var(--good);background:var(--good-bg);box-shadow:0 3px 0 var(--good)}
.prow.bad{border-color:var(--bad);background:var(--bad-bg);opacity:.7}
.prow.dim{opacity:.35}
svg.nl{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.nl-axis{stroke:var(--ink);stroke-width:2}
.nl-tick{stroke:var(--ink2);stroke-width:1.5}
.nl-lab{font:600 13px var(--ui);fill:var(--ink2);text-anchor:middle}
.nl-bar{stroke-width:9;stroke-linecap:butt;opacity:.3;transition:opacity .3s}
.nl-bar.lit{opacity:1}
.nl-marker{fill:var(--ink)}
.nl-mlab{font:800 15px var(--ui);fill:var(--ink);text-anchor:middle}
.strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 8px;border-radius:14px;background:#fff;border:2px solid var(--rule2);min-width:92px}
.card .cl{font:italic 600 19px var(--math);color:var(--cc,var(--c6i))}
.card .cv{font:700 22px var(--ui);min-height:38px;display:grid;place-items:center}
.card.given{background:#F3F6FB}
.card.ok{border-color:var(--good);background:var(--good-bg)}
.card input.num{width:80px;font-size:19px;padding:7px 4px}
.card.lit{border-color:var(--b);box-shadow:0 0 0 4px #FFE7B8}
.card .arc{position:absolute;top:-24px;left:-30px;font:800 13px var(--ui);color:var(--cci,var(--c6i));background:#fff;border:1.5px solid var(--cc,var(--c6));border-radius:99px;padding:1px 7px;opacity:0;transform:translateY(6px);transition:all .35s}
.card .arc.show{opacity:1;transform:none}
.strip.arcs{margin-top:34px}
.sumline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font:700 20px var(--ui)}
.sumline .chipv{padding:6px 12px;border-radius:10px;background:#fff;border:2px solid var(--rule2);transition:all .35s}
.sumline .chipv.in{background:var(--good-bg);border-color:var(--good);transform:translateY(-3px)}
.total{display:inline-flex;align-items:baseline;gap:8px;margin-top:14px;padding:10px 16px;border-radius:14px;background:var(--ink);color:#fff;font:800 28px var(--ui)}
.total small{font:600 14px var(--ui);opacity:.75}
.boxm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;margin-top:16px;max-width:420px}
.boxm .bh{display:grid;place-items:center;font:italic 600 24px var(--math);color:var(--ink2);padding:6px}
.boxm .bc{background:#fff;border:2px solid var(--rule2);border-radius:12px;padding:10px;display:grid;place-items:center}
.boxm .bc input.num{width:100%}
.parents{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.sigma{display:flex;align-items:center;gap:4px;margin:18px 0 6px;font-family:var(--math)}
.sigma .sg{display:flex;flex-direction:column;align-items:center;line-height:1}
.sigma .part{all:unset;cursor:pointer;border-radius:8px;padding:2px 6px;border:2px dashed transparent;transition:all .2s}
.sigma .part:hover{border-color:var(--rule2)}
.sigma .part.ok{border-color:var(--good);background:var(--good-bg)}
.sigma .part.bad{border-color:var(--bad);background:var(--bad-bg)}
.sigma .top,.sigma .bot{font-size:24px}
.sigma .S{font-size:80px;line-height:.9;padding:0 6px}
.sigma .rule{font-size:44px}
.gauss{display:grid;gap:6px;margin-top:16px}
.gauss .row{display:flex;gap:6px}
.gauss .g{flex:1;min-width:0;height:44px;border-radius:10px;display:grid;place-items:center;background:#fff;border:2px solid var(--rule2);font:700 18px var(--ui);transition:all .35s}
.gauss .g.lit{border-color:var(--c6);background:#EFF7E1}
.gauss .sums .g{background:var(--ink);color:#fff;border-color:var(--ink);opacity:0;transform:translateY(-10px)}
.gauss .sums .g.show{opacity:1;transform:none}
.stages{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.stages li{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:10px 14px;border-radius:12px;border:2px solid var(--rule);background:#fff;transition:all .3s}
.stages li.none{opacity:.45}
.stages li.lit{border-color:var(--b);background:#FFF5DE;transform:translateX(6px)}
.stages li.past{border-color:var(--good);background:var(--good-bg)}
.dials{display:grid;gap:10px;margin-top:14px}
.dial{display:grid;grid-template-columns:34px 1fr 40px minmax(90px,2fr) 40px 56px;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:#fff;border:1.5px solid var(--rule)}
.dial .dl{font:italic 600 30px var(--math);text-align:center}
.dial .dd{font-size:14px;color:var(--muted);line-height:1.25}
.dial .dv{font:600 22px/1 var(--ui);text-align:center}
.stp{all:unset;cursor:pointer;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:2px solid var(--c);color:var(--ink);font-weight:800;font-size:20px;box-shadow:0 2px 0 var(--c)}
.stp:active{transform:translateY(2px);box-shadow:none}
.dial input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:var(--rule);margin:0}
.dial input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 2px 0 var(--c);cursor:grab}
.dial input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--c);cursor:grab}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--rule2);border-radius:12px;padding:3px;background:#fff;gap:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;font-size:17px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tasks{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:8px}
.tasks li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-radius:12px;color:var(--muted);transition:background .3s,color .3s}
.tasks li .tk{width:24px;height:24px;border-radius:50%;border:2px solid var(--rule2);display:grid;place-items:center;background:#fff}
.tasks li .tk svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tasks li.active{background:#fff;color:var(--ink);border:1.5px solid var(--rule2);box-shadow:0 3px 0 var(--rule)}
.tasks li.active .tk{border-color:var(--ink)}
.tasks li.done .tk{background:var(--good);border-color:var(--good);animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.tasks li.done .tk svg{opacity:1}
.tasks .learn{margin-top:6px;font-size:15px;color:var(--ink2);padding:8px 11px;border-radius:10px;background:var(--good-bg)}
.tasks .tt-text{font-weight:600}
.timer{font:800 18px var(--ui);color:var(--ink2)}

/* overlays */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(20,27,45,.38);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal-card{width:min(460px,100%);background:#fff;border-radius:22px;border:2px solid var(--ink);box-shadow:0 8px 0 var(--ink);padding:30px 28px 26px;text-align:center;animation:cardIn .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardIn{from{transform:translateY(30px) scale(.94);opacity:0}}
.modal-card h2{font-size:32px;font-weight:800;margin-top:10px}
.modal-card p{margin-top:8px;color:var(--ink2)}
.bigstars{display:flex;justify-content:center;gap:8px}
.bigstars span svg{width:64px;height:64px;fill:var(--rule)}

/* ======================= numbers ======================= */
function fracParts(n) {

}

}
const fmtP = n => n < 0 ? `(${fmt(n)})` : fmt(n);
const fmtPH = n => n < 0 ? `(${fmtHTML(n)})` : fmtHTML(n);
const UFR = { '½': '1/2', '⅓': '1/3', '⅔': '2/3', '¼': '1/4', '¾': '3/4' };

/* ======================= polynomials ======================= */
class Poly {

function parsePoly(str, v = 'x') {

/* ======================= sound ======================= */

/* ======================= effects ======================= */
function floatXP(target, n) {

function tMoves(p) {
  const out = [], A = Math.abs(p.a), B = Math.abs(p.b);
  if (p.a < 0) out.push({ id: 'rx', g: 0, c: 'a', t: 'Reflect over the x-axis' });
  if (p.b < 0) out.push({ id: 'ry', g: 0, c: 'b', t: 'Reflect over the y-axis' });
  if (A > 1 + 1e-9) out.push({ id: 'vs', g: 1, c: 'a', t: `Vertical stretch by a factor of ${fmt(A)}` });
  if (A < 1 - 1e-9) out.push({ id: 'vc', g: 1, c: 'a', t: `Vertical compression by a factor of ${fmt(A)}` });
  if (B > 1 + 1e-9) out.push({ id: 'hc', g: 1, c: 'b', t: `Horizontal compression by a factor of ${fmt(1 / B)}` });
  if (B < 1 - 1e-9) out.push({ id: 'hs', g: 1, c: 'b', t: `Horizontal stretch by a factor of ${fmt(1 / B)}` });
  if (p.h > 0) out.push({ id: 'sr', g: 2, c: 'h', t: `Shift right ${fmt(p.h)}` });
  if (p.h < 0) out.push({ id: 'sl', g: 2, c: 'h', t: `Shift left ${fmt(-p.h)}` });
  if (p.k > 0) out.push({ id: 'su', g: 2, c: 'k', t: `Shift up ${fmt(p.k)}` });
  if (p.k < 0) out.push({ id: 'sd', g: 2, c: 'k', t: `Shift down ${fmt(-p.k)}` });
  return out;
}
function tTraps(p, correct) {
  const have = new Set(correct.map(m => m.t)), out = [];
  const add = (t, why, c) => { if (!have.has(t) && !out.some(o => o.t === t)) out.push({ t, why, c }); };
  const A = Math.abs(p.a), B = Math.abs(p.b);
  for (const m of correct) switch (m.id) {
    case 'rx': add('Reflect over the y-axis', 'The negative is out front, outside the parent. It flips y values, which reflects over the x-axis.', 'b'); break;
    case 'ry': add('Reflect over the x-axis', 'The negative is inside, attached to x. It flips x values, which reflects over the y-axis.', 'a'); break;
    case 'vs': add(`Vertical compression by a factor of ${fmt(A)}`, `|a| = ${fmt(A)} is bigger than 1, so the graph gets taller. That’s a stretch.`, 'a'); break;
    case 'vc': add(`Vertical stretch by a factor of ${fmt(A)}`, `|a| = ${fmt(A)} is between 0 and 1, so the graph gets shorter. That’s a compression.`, 'a'); break;
    case 'hc': add(`Horizontal stretch by a factor of ${fmt(B)}`, `Inside does the opposite. |b| = ${fmt(B)} squeezes the graph narrower, by a factor of ${fmt(1 / B)}.`, 'b'); break;
    case 'hs': add(`Horizontal compression by a factor of ${fmt(B)}`, `Inside does the opposite. |b| = ${fmt(B)} spreads the graph wider, by a factor of ${fmt(1 / B)}.`, 'b'); break;
    case 'sr': add(`Shift left ${fmt(p.h)}`, `Inside the parentheses the sign is backwards. x − ${fmt(p.h)} moves right.`, 'h'); break;
    case 'sl': add(`Shift right ${fmt(-p.h)}`, `Inside the parentheses the sign is backwards. x + ${fmt(-p.h)} moves left.`, 'h'); break;
    case 'su': add(`Shift down ${fmt(p.k)}`, 'k is outside, so its sign means what it says. Plus is up.', 'k'); break;
    case 'sd': add(`Shift up ${fmt(-p.k)}`, 'k is outside, so its sign means what it says. Minus is down.', 'k'); break;
  }
  if (p.a > 0) add('Reflect over the x-axis', 'There’s no negative out front, so nothing flips upside down.', 'a');
  if (near(p.k, 0)) add('Shift up ' + fmt(Math.abs(p.h) || 2), 'Nothing is added outside the parent, so there’s no vertical shift.', 'k');

}
function tSlotWhy(key, v, p) {
  if (key === 'a') {
    if (near(v, 0)) return 'a can’t be 0. Nothing out front means a = 1, and a lone minus sign means a = −1.';
    if (near(v, -p.a)) return 'a: check the sign out front.';
    return 'a is the number multiplied on the outside. Nothing written means 1.';
  }
  if (key === 'b') {
    if (near(v, 0)) return 'b can’t be 0. No number next to x means b = 1.';
    if (!near(Math.abs(p.b), 1) && near(v, 1 / p.b)) return 'b is the number right in front of x, not its reciprocal.';
    if (near(v, -p.b)) return 'b: check the sign attached to x.';
    return 'b is the number multiplying x on the inside. No number means 1.';
  }
  if (key === 'h') {
    if (near(p.h, 0)) return 'h: nothing is added or subtracted from x inside, so h = 0.';
    if (near(v, -p.h)) return 'h: sign trap. The form is (x − h), so flip the sign when you read it. x + 4 means h = −4.';
    return 'h is the number subtracted from x inside, after factoring out b.';
  }
  if (near(p.k, 0)) return 'k: nothing is added on the outside, so k = 0.';
  if (near(v, -p.k)) return 'k is outside, so its sign is honest. − 5 on the outside means k = −5.';

}

/* numeric composition: f(g(-3)) and (h o f)(2) */
function runComposeNum(ctx, Q) {
  const inner = CF[Q.inner], outer = CF[Q.outer];
  const mid = inner.fn(Q.v), out = outer.fn(mid);
  ctx.board.q(Q.label, `Find ${Q.notation}.`);
  const mach = pipelineEl([{ name: M(inner.name), rule: mh(polyHTML(inner.poly)) }, { name: M(outer.name), rule: mh(polyHTML(outer.poly)) }], inner.c);
  ctx.stageExtra(mach);
  mach.run([fmt(Q.v), '', '']);
  const steps = [
    next => choose(ctx, {
      title: 'Which function goes first?',
      lede: `${Q.notation} — decide what happens to ${M('x = ' + fmt(Q.v))} first.`,
      body: [cfBank()],
      cols: 2,
      options: [
        { html: `Put ${fmt(Q.v)} into ${M(inner.name)}`, ok: true },
        { html: `Put ${fmt(Q.v)} into ${M(outer.name)}`, why: `That’s the outer function. Work inside out: the function touching the ${fmt(Q.v)} goes first, and here that’s ${M(inner.name)}.` }
      ],
      success: `So step 1 is ${mh(`<i>${inner.name}</i>(${fmt(Q.v)})`)}.`,
      xp: 8, onDone: next
    }),
    next => ask(ctx, {
      title: `Step 1: ${mh(`<i>${inner.name}</i>(${fmt(Q.v)})`)}`,
      lede: `Substitute ${M('x = ' + fmt(Q.v))} into ${mh(inner.html)}.`,
      fields: [{ label: mh(`<i>${inner.name}</i>(${fmt(Q.v)}) =`), ans: mid, color: inner.c, why: v => {
        if (near(v, -mid)) return 'Check your signs as you substitute.';
        return `Replace every x with ${fmtP(Q.v)}: ${mh(polyWorked(inner.poly, Q.v))}.`;
      } }],
      hints: [() => `${mh(polyWorked(inner.poly, Q.v))}`],
      work: () => [`<span class="u">Step 1.</span> ${inner.name}(${fmt(Q.v)}) = ${polyWorked(inner.poly, Q.v)} = ${fmt(mid)}`],
      success: () => `${mh(`<i>${inner.name}</i>(${fmt(Q.v)}) = ${fmt(mid)}`)}. That number is now the input for ${M(outer.name)}.`,
      after: async () => { await mach.run([fmt(Q.v), fmt(mid), '']); },
      xp: 12, onDone: next
    }),
    next => ask(ctx, {
      title: `Step 2: ${mh(`<i>${outer.name}</i>(${fmt(mid)})`)}`,
      lede: `Now feed ${M(fmt(mid))} into ${mh(outer.html)}.`,
      fields: [{ label: Q.notation.replace('</span>', ' =</span>'), ans: out, color: outer.c, why: v => {
        if (near(v, inner.fn(mid))) return `You used ${M(inner.name)} again. The second machine is ${M(outer.name)}.`;
        if (near(v, -out)) return 'Right size, wrong sign.';
        return `Substitute ${fmtP(mid)} into ${M(outer.name)}: ${mh(polyWorked(outer.poly, mid))}.`;
      } }],
      hints: [() => `${mh(polyWorked(outer.poly, mid))}`],
      work: () => [`<span class="u">Step 2.</span> ${outer.name}(${fmt(mid)}) = ${polyWorked(outer.poly, mid)} = ${fmt(out)}`, `<span class="u">Answer.</span> ${Q.plain} = ${fmt(out)}`],
      success: () => `${Q.notation} ${M('= ' + fmt(out))}.`,
      after: async () => { await mach.run([fmt(Q.v), fmt(mid), fmt(out)]); },
      xp: 14, onDone: () => ctx.finish(), doneLabel: 'Finish'
    })
  ];
  let i = 0;
  const go = () => { ctx.setSteps(steps.length, i); steps[i](() => { i++; i < steps.length ? go() : null; }); };
  go();
}
function polyWorked(poly, v) {
  const ts = poly.terms();
  return ts.map(([d, c], idx) => {
    const a = Math.abs(c), sign = idx === 0 ? (c < 0 ? MINUS : '') : (c < 0 ? ` ${MINUS} ` : ' + ');
    if (d === 0) return sign + fmt(a);
    const coef = near(a, 1) ? '' : fmt(a);
    return sign + coef + `(${fmt(v)})` + (d > 1 ? `<sup>${d}</sup>` : '');
  }).join('') + ' = ' + ts.map(([d, c], idx) => {
    const term = c * Math.pow(v, d), a = Math.abs(term);
    return (idx === 0 ? (term < 0 ? MINUS : '') : (term < 0 ? ` ${MINUS} ` : ' + ')) + fmt(a);
  }).join('');
}

/* symbolic composition */
function runComposeSym(ctx, Q) {
  const inner = CF[Q.inner], outer = CF[Q.outer];
  const comp = substPoly(outer.poly, inner.poly);
  ctx.board.q(Q.label, `Find ${Q.notation}.`);
  const sub = el('div', { class: 'rulebox' }, el('span', { class: 'm', html: `<i>${outer.name}</i>(<span class="hl">${inner.name === 'x' ? 'x' : `<i>${inner.name}</i>(<i>x</i>)`}</span>) = ${substHTML(outer.poly, `<span class="hl">(${polyHTML(inner.poly)})</span>`)}` }));
  ctx.stageExtra(el('div', {}, cfBank(), sub));
  const steps = [
    next => choose(ctx, {
      title: 'Substitute the inside function',
      lede: [`${Q.notation} means: take the rule for ${M(outer.name)} and replace every ${M('x')} with the whole expression ${mh(`<i>${inner.name}</i>(<i>x</i>) = ${polyHTML(inner.poly)}`)}.`,
        'Which setup is right?'],
      cols: 1, optClass: 'm',
      options: [
        { html: substHTML(outer.poly, `(${polyHTML(inner.poly)})`), ok: true },
        { html: substHTML(outer.poly, polyHTML(inner.poly)), why: 'The parentheses matter. Without them, a coefficient or exponent only hits the first term instead of the whole expression.' },
        { html: substHTML(inner.poly, `(${polyHTML(outer.poly)})`), why: `That’s backwards. You substituted ${M(outer.name)} into ${M(inner.name)}. The outer function is ${M(outer.name)}, so ${M(outer.name)}’s rule is the one that receives.` }
      ],
      success: 'Every x in the outer rule gets the entire inner expression, wrapped in parentheses.',
      work: () => [`<span class="u">Substitute.</span> ${Q.plain} = ${substText(outer.poly, `(${polyText(inner.poly)})`)}`],
      xp: 10, onDone: next
    }),
    next => ask(ctx, {
      title: 'Now expand and simplify',
      lede: [`Distribute, square where needed, then combine like terms.`, `Type your answer with <code>^</code> for powers, like <code>6x^2 - 15x + 20</code>.`],
      body: [el('p', { class: 'big m', html: substHTML(outer.poly, `<span class="hl">(${polyHTML(inner.poly)})</span>`) })],
      fields: [{ kind: 'expr', label: `${Q.notation} =`, ans: comp, color: outer.c, why: got => {
        const naive = substPolyNaive(outer.poly, inner.poly);
        if (naive && got.eq(naive)) return 'That’s what you get if the parentheses are dropped. Every term of the inner function has to be multiplied or squared, not just the first one.';
        const rev = substPoly(inner.poly, outer.poly);
        if (got.eq(rev)) return `Those are composed in the wrong order. This one is ${Q.plain}, so ${M(inner.name)} goes inside.`;
        if (outer.poly.deg() === 2 && got.deg() === 2) return 'Check the squared part. Remember (A + B)² = A² + 2AB + B², not A² + B².';
        return 'Not quite. Expand one piece at a time and watch the signs.';
      } }],
      hints: [() => `Expand the squared part first: ${mh(sqHint(outer.poly, inner.poly))}`,
        () => `You should end up with ${mh(polyHTML(comp))} after combining like terms.`],
      work: () => [`<span class="u">Answer.</span> ${Q.plain} = ${polyText(comp)}`],
      success: 'Expanded and combined.',
      xp: 18, onDone: () => ctx.finish(), doneLabel: 'Finish'
    })
  ];
  let i = 0;
  const go = () => { ctx.setSteps(steps.length, i); steps[i](() => { i++; i < steps.length ? go() : null; }); };
  go();
}
function substPoly(outer, innerP) {
  let r = new Poly({});
  for (const [d, c] of outer.terms()) { let t = Poly.num(c); for (let i = 0; i < d; i++) t = t.mul(innerP); r = r.add(t); }
  return r.clean();
}
function substPolyNaive(outer, innerP) {
  const ts = innerP.terms(); if (ts.length < 2) return null;
  const lead = new Poly({ [ts[0][0]]: ts[0][1] }), rest = innerP.sub(lead);
  let r = new Poly({});
  for (const [d, c] of outer.terms()) {
    if (d === 0) { r = r.add(Poly.num(c)); continue; }
    let t = Poly.num(c); for (let i = 0; i < d; i++) t = t.mul(lead);
    r = r.add(t).add(rest);
  }
  return r.clean();
}
function substHTML(outer, repl) {
  const ts = outer.terms(); if (!ts.length) return '0';
  return ts.map(([d, c], i) => {
    const a = Math.abs(c), sign = i === 0 ? (c < 0 ? MINUS : '') : (c < 0 ? ` ${MINUS} ` : ' + ');
    if (d === 0) return sign + fmtHTML(a);
    return sign + (near(a, 1) ? '' : fmtHTML(a)) + repl + (d > 1 ? `<sup>${d}</sup>` : '');
  }).join('');
}
const substText = (outer, repl) => substHTML(outer, repl).replace(/<sup>(\d)<\/sup>/g, (m, d) => SUP[d] || '^' + d).replace(/<[^>]+>/g, '');
function sqHint(outer, innerP) {
  if (outer.deg() < 2) return substHTML(outer, `(${polyHTML(innerP)})`);
  const sq = innerP.mul(innerP);
  return `(${polyHTML(innerP)})<sup>2</sup> = ${polyHTML(sq)}`;
}

function tNotation(p, parentHTML) {

  if (!near(p.b, 1)) ix = (near(p.b, -1) ? `<span class="pb">${MINUS}</span>` : `<span class="pb">${fmtHTML(p.b)}</span>`) + '<i>x</i>';
  let body = ix;
  if (!near(p.h, 0)) {
    const hs = p.h > 0 ? ` ${MINUS} <span class="ph">${fmtHTML(p.h)}</span>` : ` + <span class="ph">${fmtHTML(-p.h)}</span>`;
    body = near(p.b, 1) ? ix + hs : `<span class="pb">${near(p.b, -1) ? MINUS : fmtHTML(p.b)}</span>(<i>x</i>${hs})`;
  }
  const sub = parentHTML.replace('<i>x</i>', body);
  s += (!near(p.h, 0) && !near(p.b, 1)) || parentHTML.includes('sup') ? sub.replace(body, `(${body})`).replace('((', '(').replace('))', ')') : sub;
  if (parentHTML.includes('rad') || parentHTML.includes('|')) s = (near(p.a, 1) ? '' : s.split(parentHTML[0])[0]) + parentHTML.replace('<i>x</i>', body);
  else {
    let pre = '';
    if (near(p.a, -1)) pre = `<span class="pa">${MINUS}</span>`; else if (!near(p.a, 1)) pre = `<span class="pa">${fmtHTML(p.a)}</span>`;
    s = pre + parentHTML.replace('<i>x</i>', body.includes(' ') || body.includes('span') ? `(${body})` : body);
  }
  if (!near(p.k, 0)) s += p.k > 0 ? ` + <span class="pk">${fmtHTML(p.k)}</span>` : ` ${MINUS} <span class="pk">${fmtHTML(-p.k)}</span>`;
  return s;
}

function tPoints(Q, g) {
  const Pf = PARENTS[Q.parent], rows = [];
  const cand = [];
  if (Q.parent === 'sqrt') { for (let r = 0; r <= 10; r += .5) cand.push(r * r); }
  else for (let x = -24; x <= 24; x += .5) cand.push(x);
  const den = q => near(q, Math.round(q)) ? 1 : near(q * 2, Math.round(q * 2)) ? 2 : near(q * 4, Math.round(q * 4)) ? 4 : 0;
  for (const x of cand) {
    const y = Pf.fn(x);
    if (!isFinite(y)) continue;
    const tx = x / Q.b + Q.h, ty = Q.a * y + Q.k;
    if (!g.on(tx, ty)) continue;
    const dx = den(tx), dy = den(ty);
    if (!dx || !dy) continue;
    if (rows.some(r => near(r.tx, tx))) continue;
    rows.push({ x, y, tx, ty, d: Math.max(dx, dy, den(x), den(y)) });
  }
  for (const D of [1, 2, 4]) {
    const pool = rows.filter(r => r.d <= D);
    if (pool.length < 5 && D < 4) continue;
    pool.sort((a, b) => a.tx - b.tx);
    const want = Math.min(5, pool.length);
    let out = [];
    if (want <= 1) out = pool.slice();
    else for (let i = 0; i < want; i++) out.push(pool[Math.round(i * (pool.length - 1) / (want - 1))]);
    out = [...new Set(out)];
    const anchor = pool.find(r => near(r.x, Q.parent === 'sqrt' ? 0 : 0));
    if (anchor && !out.includes(anchor)) out[Math.min(2, out.length - 1)] = anchor;
    out = [...new Set(out)].sort((a, b) => a.tx - b.tx);
    return { pts: out, step: 1 / Math.max(...out.map(r => r.d)) };
  }
  return { pts: rows.slice(0, 5), step: .25 };
}

function shapeWhy(id, pc) {

function testAnswerText(Q) {

<script>
/* =======================================================
   UNIT 2 PRACTICE — master Quiz 2.1–2.2, one question at a time.
   Each quiz question has four steps:
     Watch    — a slow Ponder walk-through of that exact question
     Together — the exact question, interactive, with help
     Twin     — same kind of question, new numbers, lighter help
     Prove it — new numbers, no hints, every part right
   Then the final (the real quiz, no hints) and endless "keep sharp" twins.
   ======================================================= */
const PCHAP = { id: 'u2p', unit: 2, c: 'c5', num: 'P', title: 'Practice' };
const pTerm = v => v < 0 ? ` ${MINUS} ${fmt(-v)}` : ` + ${fmt(v)}`;          /* " + 3" or " − 3" */
const pBinom = r => r === 0 ? '<i>x</i>' : `<i>x</i>${pTerm(-r)}`;          /* x − r */
const pLead = a => near(a, 1) ? '' : near(a, -1) ? MINUS : fmtHTML(a);
const pSquare = h => h === 0 ? '<i>x</i><sup>2</sup>' : `(${pBinom(h)})<sup>2</sup>`;
const onGrid = pts => pts.every(([x, y]) => Math.abs(x) <= 10 && Math.abs(y) <= 10);
const seq = (a, b) => { const r = []; for (let x = a; x <= b; x++) r.push(x); return r; };
/* decimals the way you'd write them on the sheet: 2.5, not 5/2 */
const dec = v => near(v, Math.round(v)) ? fmt(Math.round(v)) : String(+v.toFixed(2)).replace('-', MINUS);
const FR_HALF = `<span class="frac"><span>1</span><span>2</span></span>`;
function pCond(pc) {
  const lt = c => (c ? '≤' : '&lt;'), gt = c => (c ? '≥' : '&gt;');
  if (!isFinite(pc.lo)) return `<i>x</i> ${lt(pc.hiC)} ${fmt(pc.hi)}`;
  if (!isFinite(pc.hi)) return `<i>x</i> ${gt(pc.loC)} ${fmt(pc.lo)}`;
  return `${fmt(pc.lo)} ${lt(pc.loC)} <i>x</i> ${lt(pc.hiC)} ${fmt(pc.hi)}`;
}

/* ---------- the quiz itself ---------- */
function quadQ(o) {
  o.fn = o.fn || (x => o.a * Math.pow(x - o.h, 2) + o.k);
  o.up = o.a > 0;
  o.ys = o.xs.map(o.fn);
  return o;
}
function pwQ(o) {
  o.type = 'piecewise';
  o.pieces.forEach(pc => (pc.cond = pCond(pc)));
  o.html = pwDisplay(o.name, o.pieces);
  return o;
}
const QUIZ = {
  q1: quadQ({ num: 1, type: 'vertex', name: 'f', a: .5, h: 6, k: 2, xs: [4, 5, 6, 7, 8], asks: ['domain', 'range'],
    html: `<i>f</i>(<i>x</i>) = ${FR_HALF}(<i>x</i> ${MINUS} 6)<sup>2</sup> + 2` }),
  q2: quadQ({ num: 2, type: 'intercept', name: 'g', a: -1, h: 2, k: 9, roots: [5, -1], xs: [-1, 0, 1, 2, 3, 4, 5], asks: ['vertex', 'maxmin', 'inc', 'dec'],
    fn: x => -(x - 5) * (x + 1), html: `<i>g</i>(<i>x</i>) = ${MINUS}(<i>x</i> ${MINUS} 5)(<i>x</i> + 1)` }),
  q3: quadQ({ num: 3, type: 'standard', name: 'h', A: -3, B: -6, C: 1, a: -3, h: -1, k: 4, xs: [-3, -2, -1, 0, 1], asks: ['axis', 'vertex', 'maxmin'],
    fn: x => -3 * x * x - 6 * x + 1, html: `<i>h</i>(<i>x</i>) = ${MINUS}3<i>x</i><sup>2</sup> ${MINUS} 6<i>x</i> + 1` }),
  q4: pwQ({ num: 4, name: 'f', asks: ['domain', 'range'], evals: [-2, 2, 4], pieces: [
    { kind: 'parab', pa: -1, ph: -3, pk: 3, fn: x => -Math.pow(x + 3, 2) + 3, lo: -Infinity, hi: -2, hiC: false, shape: 'parabD', vertex: -3, xs: [-5, -4, -3, -2],
      rule: `${MINUS}(<i>x</i> + 3)<sup>2</sup> + 3` },
    { kind: 'parab', pa: 1, ph: 1, pk: -9, fn: x => Math.pow(x - 1, 2) - 9, lo: -2, hi: 3, loC: true, hiC: false, shape: 'parabU', vertex: 1, xs: [-2, -1, 0, 1, 2, 3],
      rule: `(<i>x</i> ${MINUS} 1)<sup>2</sup> ${MINUS} 9` },
    { kind: 'line', m: 3, c: -7, fn: x => 3 * x - 7, lo: 3, hi: Infinity, loC: true, shape: 'lineU', xs: [3, 4, 5],
      rule: `3<i>x</i> ${MINUS} 7` }
  ] })
};

/* ---------- twins: same kind of question, new numbers ---------- */
function pTable(a, h, k, wide) {
  const f = x => a * Math.pow(x - h, 2) + k;
  const tries = wide ? [[-4, -2, 0, 2, 4], [-2, -1, 0, 1, 2], [-1, 0, 1]] : [[-2, -1, 0, 1, 2], [-1, 0, 1]];
  for (const offs of tries) { const xs = offs.map(o => h + o); if (onGrid(xs.map(x => [x, f(x)]))) return xs; }
  return null;
}
function twinVertex() {
  for (let t = 0; t < 1000; t++) {
    const a = pick([.5, .5, -.5, 2, -2, 1, -1]), h = randInt(-5, 6), k = randInt(-6, 6);
    if (h === 0 || k === 0) continue;
    const xs = pTable(a, h, k, Math.abs(a) < 1);
    if (!xs || xs.length < 5) continue;
    const n = pick(['f', 'g', 'p']);
    return quadQ({ type: 'vertex', name: n, a, h, k, xs, asks: ['domain', 'range'],
      html: `<i>${n}</i>(<i>x</i>) = ${pLead(a)}${pSquare(h)}${pTerm(k)}` });
  }
  return QUIZ.q1;
}
function twinIntercept() {
  for (let t = 0; t < 1000; t++) {
    const d = pick([2, 3, 3]), h = randInt(-4, 4), a = pick([-1, -1, 1, -2, 2]);
    const p = h - d, q = h + d, k = -a * d * d;
    if (Math.abs(k) > 10 || p === 0 || q === 0) continue;
    const fn = x => a * (x - p) * (x - q), xs = seq(p, q);
    if (!onGrid(xs.map(x => [x, fn(x)]))) continue;
    const order = Math.random() < .5 ? [q, p] : [p, q];
    const n = pick(['g', 'f', 'r']);
    return quadQ({ type: 'intercept', name: n, a, h, k, roots: order, fn, xs, asks: ['vertex', 'maxmin', 'inc', 'dec'],
      html: `<i>${n}</i>(<i>x</i>) = ${pLead(a)}${order.map(r => `(${pBinom(r)})`).join('')}` });
  }
  return QUIZ.q2;
}
function twinStandard() {
  for (let t = 0; t < 1000; t++) {
    const A = pick([-3, -3, 3, -2, 2, -1]), h = randInt(-3, 3), k = randInt(-4, 6);
    if (h === 0) continue;
    const B = -2 * A * h, C = A * h * h + k;
    const xs = pTable(A, h, k, false);
    if (!xs || xs.length < 5 || Math.abs(C) > 30) continue;
    const n = pick(['h', 'p', 'q']);
    return quadQ({ type: 'standard', name: n, A, B, C, a: A, h, k, xs, asks: ['axis', 'vertex', 'maxmin'],
      fn: x => A * x * x + B * x + C, html: `<i>${n}</i>(<i>x</i>) = ${polyHTML(P(`${A}x^2+${B}x+${C}`))}` });
  }
  return QUIZ.q3;
}
function twinPiecewise() {
  for (let t = 0; t < 3000; t++) {
    const b1 = randInt(-3, -1), b2 = b1 + 5, flip = Math.random() < .35;
    const h1 = b1 - 1, k1 = randInt(1, 6);
    const h2 = randInt(b1 + 1, b2 - 1), k2 = randInt(-9, -3);
    const m = pick([1, 2, 3]), y0 = randInt(-4, 3), c = y0 - m * b2;
    if (k1 <= y0) continue;                      /* left piece and right piece must overlap, so the range is every y */
    const p1 = { kind: 'parab', pa: -1, ph: h1, pk: k1, fn: x => -Math.pow(x - h1, 2) + k1, lo: -Infinity, hi: b1, hiC: flip, shape: 'parabD', vertex: h1, xs: [h1 - 2, h1 - 1, h1, b1],
      rule: `${MINUS}${pSquare(h1)}${pTerm(k1)}` };
    const p2 = { kind: 'parab', pa: 1, ph: h2, pk: k2, fn: x => Math.pow(x - h2, 2) + k2, lo: b1, hi: b2, loC: !flip, hiC: flip, shape: 'parabU', vertex: h2, xs: seq(b1, b2),
      rule: `${pSquare(h2)}${pTerm(k2)}` };
    const p3 = { kind: 'line', m, c, fn: x => m * x + c, lo: b2, hi: Infinity, loC: !flip, shape: 'lineU', xs: [b2, b2 + 1, b2 + 2],
      rule: polyHTML(P(`${m}x+${c}`)) };
    const pts = [p1, p2, p3].flatMap(pc => pc.xs.map(x => [x, pc.fn(x)]));
    if (!onGrid(pts)) continue;
    const mid = pick(seq(b1 + 1, b2 - 1).filter(x => x !== h2));
    return pwQ({ name: pick(['f', 'g']), asks: ['domain', 'range'], evals: [flip ? b2 : b1, mid, b2 + 1], pieces: [p1, p2, p3] });
  }

}

/* ---------- worked substitutions, written the way you'd write them ---------- */
const subIn = (r, x) => r === 0 ? fmtP(x) : `(${fmt(x)}${pTerm(-r)})`;   /* (x − r) with x filled in */
function rowWork(Q, x) {
  const y = dec(Q.fn(x));
  if (Q.type === 'vertex') {
    const d = x - Q.h;
    return `${pLead(Q.a)}${subIn(Q.h, x)}<sup>2</sup>${pTerm(Q.k)} = ${pLead(Q.a)}(${fmt(d)})<sup>2</sup>${pTerm(Q.k)} = ${dec(Q.a * d * d)}${pTerm(Q.k)} = ${y}`;
  }
  if (Q.type === 'intercept') {
    return `${pLead(Q.a)}${Q.roots.map(r => subIn(r, x)).join('')} = ${pLead(Q.a)}${Q.roots.map(r => `(${fmt(x - r)})`).join('')} = ${y}`;
  }
  return `${polyWorked(P(`${Q.A}x^2+${Q.B}x+${Q.C}`), x)} = ${y}`;
}
function pieceWork(pc, x) {
  const y = dec(pc.fn(x));
  if (pc.kind === 'line') return `${fmt(pc.m)}(${fmt(x)})${pTerm(pc.c)} = ${fmt(pc.m * x)}${pTerm(pc.c)} = ${y}`;
  return `${pLead(pc.pa)}${subIn(pc.ph, x)}<sup>2</sup>${pTerm(pc.pk)} = ${pLead(pc.pa)}(${fmt(x - pc.ph)})<sup>2</sup>${pTerm(pc.pk)} = ${y}`;
}
const ownerOf = (Q, x) => Q.pieces.findIndex(pc =>
  (isFinite(pc.lo) ? (pc.loC ? x >= pc.lo - 1e-9 : x > pc.lo + 1e-9) : true) &&
  (isFinite(pc.hi) ? (pc.hiC ? x <= pc.hi + 1e-9 : x < pc.hi - 1e-9) : true));

/* ---------- running a question: guided, twin or check (no hints) ---------- */
function runSteps(ctx, steps, Q, mode) {
  let i = 0;
  const go = () => {
    ctx.setSteps(steps.length, i);
    const [name, run] = steps[i];
    ctx.stepName = name;
    ctx.onSlip = null;
    run(() => { i++; i < steps.length ? go() : ctx.finish(); });
    const topic = topicOf(Q, name);
    if (topic) attachHelp(ctx, Q, topic, mode);
  };
  go();
}
/* every step gets a way back to the lesson and a worked example on a different problem.
   While proving it (no hints) they only appear after a slip. */
function attachHelp(ctx, Q, topic, mode) {
  const w = ctx.panel.querySelector('.scr');
  if (!w) return;
  const bar = el('div', { class: 'helpbar' + (mode === 'check' ? ' later' : '') },
    el('span', { class: 'hb-lbl' }, mode === 'check' ? 'Stuck?' : 'Need help?'),
    el('button', { class: 'hbtn', type: 'button', onclick: () => showExample(Q, topic) }, el('b', { class: 'qm' }, '?'), 'See an example'),
    el('button', { class: 'hbtn', type: 'button', onclick: () => showTaught(Q, topic) }, '↩ Where was this taught?'));
  w.append(bar);
  ctx.onSlip = () => { bar.classList.remove('later', 'nudge'); void bar.offsetWidth; bar.classList.add('nudge'); };
}
function intervalAsk(ctx, Q, key, mode, next) {
  const guided = mode === 'guided', say = (t, s) => guided ? [].concat(t) : [].concat(s);
  const up = Q.up, h = Q.h, k = Q.k;
  const sideWhy = got => {
    if ((isFinite(got.a) && near(got.a, k)) || (isFinite(got.b) && near(got.b, k))) return `Intervals use x values. ${M('y = ' + fmt(k))} is a height, not an x.`;
    return null;
  };
  const S = {
    domain: { title: 'Domain', ans: { a: -Infinity, b: Infinity },
      lede: say(['Domain means every x you are allowed to put in.', 'Any x works in a quadratic, so it runs forever both ways.'], 'Domain:'),
      why: () => 'Every x works, so it runs from −∞ to ∞.' },
    range: { title: 'Range', ans: up ? { a: k, b: Infinity, ac: true } : { a: -Infinity, b: k, bc: true },
      lede: say([`Range means every y the graph reaches.`, up ? `It opens up, so it starts at the vertex height, ${M('y = ' + fmt(k))}, and goes up forever.` : `It opens down, so it comes up from −∞ to the vertex height, ${M('y = ' + fmt(k))}.`], 'Range:'),
      why: got => (isFinite(got.a) && near(got.a, h)) || (isFinite(got.b) && near(got.b, h)) ? `Range uses y values. ${M('x = ' + fmt(h))} is the vertex x — use its height, ${M(fmt(k))}.` : `The graph ${up ? 'starts' : 'stops'} at the vertex height, ${M('y = ' + fmt(k))}.`,
      bracketWhy: () => `The graph touches ${M('y = ' + fmt(k))} at the vertex, so that end gets a square bracket. ∞ always gets a round one.` },
    inc: { title: 'Increasing interval', ans: up ? { a: h, b: Infinity } : { a: -Infinity, b: h },
      lede: say(['Read the graph left to right.', `It goes up ${up ? 'after' : 'until'} the vertex at ${M('x = ' + fmt(h))}.`], 'Increasing interval:'),
      why: got => sideWhy(got) || (up ? `It climbs to the right of the vertex, ${M('x = ' + fmt(h))}.` : `It climbs from the far left up to the vertex, ${M('x = ' + fmt(h))}.`),
      bracketWhy: () => 'At the vertex it is turning, not climbing, so that end gets a round bracket.' },
    dec: { title: 'Decreasing interval', ans: up ? { a: -Infinity, b: h } : { a: h, b: Infinity },
      lede: say(['Read the graph left to right.', `It goes down ${up ? 'until' : 'after'} the vertex at ${M('x = ' + fmt(h))}.`], 'Decreasing interval:'),
      why: got => sideWhy(got) || (up ? `It falls from the far left down to the vertex, ${M('x = ' + fmt(h))}.` : `It falls to the right of the vertex, ${M('x = ' + fmt(h))}.`),
      bracketWhy: () => 'At the vertex it is turning, not falling, so that end gets a round bracket.' }
  }[key];
  const show = A => `${A.ac ? '[' : '('}${A.a === -Infinity ? NINF : fmt(A.a)}, ${A.b === Infinity ? INF : fmt(A.b)}${A.bc ? ']' : ')'}`;
  ask(ctx, {
    title: S.title, lede: S.lede,
    fields: [{ kind: 'interval', ans: S.ans, why: S.why, bracketWhy: S.bracketWhy }],
    hints: mode === 'check' ? [] : [() => `The answer is ${mh(show(S.ans))}.`],
    work: () => [`${S.title}: ${show(S.ans)}`],

    xp: 12, onDone: next
  });
}
function runQuizQuad(ctx, Q, mode) {
  const g = ctx.graph, guided = mode === 'guided', check = mode === 'check';
  const say = (teach, short) => guided ? [].concat(teach) : [].concat(short);
  const help = hs => check ? [] : hs;

  const big = () => el('p', { class: 'big m', html: Q.html });
  const vtx = mh(`(${fmt(Q.h)}, ${fmt(Q.k)})`);
  ctx.board.q(Q.label, check ? 'No hints. Get every part right.' : 'Graph it and answer every part.', Q.html);
  g.reset();
  const steps = [];
  if (Q.type === 'vertex') {
    steps.push(['Vertex', next => ask(ctx, {
      title: 'Find the vertex',
      lede: say(['In vertex form the vertex is written right in the equation.', 'Inside the brackets: flip the sign. Outside: keep it.'], `Read the vertex and ${M('a')}.`),

        { key: 'h', label: mh('vertex <i>x</i> ='), inline: true, cls: 'sm', ans: Q.h, color: 'h', why: v => near(v, -Q.h) ? 'Flip the sign of the number inside the brackets.' : 'Look at the number inside the brackets, then flip its sign.' },
        { key: 'k', label: mh('vertex <i>y</i> ='), inline: true, cls: 'sm', ans: Q.k, color: 'k', why: v => near(v, -Q.k) ? 'The number outside keeps its sign.' : 'It’s the number added at the end.' },
        { key: 'a', label: mh('<i>a</i> ='), inline: true, cls: 'sm', ans: Q.a, color: 'a', why: () => near(Math.abs(Q.a), .5) ? 'a is the number in front. For ½ type 1/2.' : 'a is the number in front of the brackets. A lone minus means −1.' }
      ],
      hints: help(['Flip the sign inside the brackets. Keep the sign outside.', () => `Vertex ${vtx}, ${M('a')} = ${dec(Q.a)}.`]),
      work: () => [`Vertex (${fmt(Q.h)}, ${fmt(Q.k)}), a = ${dec(Q.a)}`],
      success: `Vertex ${vtx}. ${Q.up ? 'a is positive, so it opens up.' : 'a is negative, so it opens down.'}`,
      xp: 12, onDone: next
    })]);
  } else if (Q.type === 'intercept') {
    const [r1, r2] = Q.roots;
    steps.push(['Zeros', next => ask(ctx, {
      title: 'Find the zeros',
      lede: say(['Each bracket makes a zero: the x that turns it into 0.', 'Flip the sign of the number in each bracket.'], 'Find both zeros.'),
      body: [big()],
      fields: Q.roots.map((r, i) => ({ key: 'r' + i, label: `zero ${i + 1}: ${M('x =')}`, inline: true, cls: 'sm', ans: r, anyOrder: Q.roots, color: 'c3',
        why: v => Q.roots.some(q => near(v, -q)) ? 'Flip the sign: (x − 5) is zero at x = 5, (x + 1) at x = −1.' : 'Set each bracket equal to 0 and solve.' })),
      hints: help([() => `${mh(`(${pBinom(r1)})`)} is 0 when ${M('x = ' + fmt(r1))}.`]),
      work: () => [`Zeros: x = ${fmt(r1)} and x = ${fmt(r2)}`],
      success: 'Those are where the graph crosses the x-axis.',
      after: async () => { g.dot(r1, 0, 'pt-inv'); g.dot(r2, 0, 'pt-inv'); Sound.pop(); },
      xp: 12, onDone: next
    })]);
    steps.push(['Vertex', next => ask(ctx, {
      title: 'The vertex is halfway between',
      lede: say(['The vertex sits exactly halfway between the two zeros.', `Find that x, then put it into ${mh(rhs)} for the y.`], 'Find the vertex.'),
      fields: [
        { key: 'x', label: mh('vertex <i>x</i> ='), inline: true, cls: 'sm', ans: Q.h, color: 'c3', why: v => Q.roots.some(r => near(v, r)) ? 'That’s a zero. The vertex is halfway between the zeros.' : `Add the zeros, then halve: ${mh(`(${fmt(r1)} + ${fmtP(r2)}) ÷ 2`)}.` },
        { key: 'y', label: mh('vertex <i>y</i> ='), inline: true, cls: 'sm', ans: Q.k, color: 'c3', why: () => guided ? `${fx(Q.h)} = ${rowWork(Q, Q.h)}` : `Put ${M('x = ' + fmt(Q.h))} into both brackets, then multiply.` }
      ],

      work: () => [`Vertex: (${fmt(Q.h)}, ${fmt(Q.k)})`],

      body: [big()],
      fields: [{ label: mh('<i>x</i> ='), inline: true, cls: 'sm', ans: Q.h, color: 'c1', why: v => near(v, -Q.h) ? 'Check the signs. −b flips the sign of b.' : `${M('-b')} is ${M(fmt(-Q.B))} and ${M('2a')} is ${M(fmt(2 * Q.A))}. Divide.` }],
      hints: help([() => `${M('-b')} = ${M(fmt(-Q.B))} and ${M('2a')} = ${M(fmt(2 * Q.A))}.`, () => `${mh(`${fmt(-Q.B)} ÷ ${fmtP(2 * Q.A)} = ${fmt(Q.h)}`)}`]),
      work: () => [`Axis: x = ${fmt(-Q.B)} ÷ ${fmtP(2 * Q.A)} = ${fmt(Q.h)}`],
      success: `The axis of symmetry is ${M('x = ' + fmt(Q.h))}.`,
      after: async () => { g.path('aos0', `M${g.X(Q.h)},${g.Y(-g.R)}L${g.X(Q.h)},${g.Y(g.R)}`, 'mirror'); },

      lede: say([`Put ${M('x = ' + fmt(Q.h))} back in.`, 'Square first, then multiply, then add.'], `Find ${fx(Q.h)}.`),

          passed.add(key); b.classList.add('ok'); [...box.children].forEach(x => x !== b && x.classList.add('dim'));
          fb.className = 'pz-qfb good'; fb.innerHTML = B.quiz.yes || 'Yes! You’ve got it.'; again.remove();
          Sound.good(); stepDone = true; nextB.classList.add('ready');
          if (playing) holdT = setTimeout(() => { if (ctx.alive && my === token) go(bi + 1); }, 2800);
        } else {
          b.classList.add('bad'); Sound.bad(); shake(b);
          fb.className = 'pz-qfb bad'; fb.innerHTML = o.why || 'Not quite.';
        }
      };
      return b;
    }));
    qz.append(el('p', { class: 'pz-qtag' }, 'Quick check'), box, fb, el('div', { class: 'actions', style: 'margin-top:4px' }, again));
    quizPick = right => { const i = opts.findIndex(o => !!o.ok === right); box.children[i].click(); };
    nextB.classList.remove('ready');
  }
  /* moving forward stops at any quick check that hasn't been answered yet */
  function gate(i) {
    for (let j = bi; j < Math.min(i, beats().length); j++) if (beats()[j].quiz && !passed.has(si + '.' + j)) return j;
    return -1;
  }
  function hold() {
    /* slow on purpose: read it, look at the picture, then move on */
    const plain = say.textContent.length;
    const ms = RM ? 6000 : clamp(3400 + plain * 80, 5000, 9500);
    if (!RM && bar.firstChild.animate) barAnim = bar.firstChild.animate([{ width: '0%' }, { width: '100%' }], { duration: ms, fill: 'forwards' });
    holdT = setTimeout(() => { if (ctx.alive) go(bi + 1); }, ms);
  }
  function go(i) {
    if (!ctx.alive) return;
    if (i > bi) {
      const b = gate(i);
      if (b === bi) { if (qz.animate) qz.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 300 }); return; }
      if (b >= 0) i = b;
    }
    if (i < 0) { if (si > 0) { setScene(si - 1); i = beats().length - 1; } else i = 0; }
    else if (i >= beats().length) { if (si < scenes.length - 1) { setScene(si + 1); i = 0; } else return showEnd(); }
    runTo(i);
  }
  function showEnd() {
    if (finished) return; finished = true; stopHold();
    ctx.setSteps(scenes.length, scenes.length);
    end.innerHTML = '';
    const b = el('button', { class: 'btn primary', type: 'button', onclick: opts.onDone }, opts.doneLabel || 'Done');
    end.append(b, el('button', { class: 'btn ghost', type: 'button', onclick: () => { setScene(0); runTo(0); } }, 'Watch it all again'));
    ctx.test = { kind: 'continue', el: b };
    setTimeout(() => b.focus({ preventScroll: true }), 40);
  }
  const onKey = e => {
    if (!ctx.alive) return document.removeEventListener('keydown', onKey);
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(bi + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(bi - 1); }
  };
  document.addEventListener('keydown', onKey);
  ctx.test = { kind: 'ponder', next: () => go(bi + 1), get state() { return { si, bi, stepDone, finished }; }, get quiz() { return quizPick; }, scenes };
  setScene(0); paintPlay(); runTo(opts.start || 0);
}
