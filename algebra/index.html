    { say: `The zeros are ${fmt(E.roots[0])} and ${fmt(E.roots[1])}.`, run: Z => E.roots.forEach(q => Z.dot(q, 0, 'pt-inv')) }
  ],
  midVertex: E => {
    const [r1, r2] = E.roots, z = Z => E.roots.forEach(q => Z.dot(q, 0, 'pt-inv'));
    return [
      { say: `The zeros are ${fmt(r1)} and ${fmt(r2)}.`, run: Z => z(Z) },
      { say: 'The vertex is halfway between them.', run: Z => { z(Z); Z.band(Math.min(r1, r2), Math.max(r1, r2)); } },
      { say: `(${fmt(r1)} + ${fmtP(r2)}) ÷ 2 = ${fmt(E.h)}.`, run: Z => { z(Z); Z.vline('m', E.h); Z.point(E.h, 0); Z.work(`(${fmt(r1)} + ${fmtP(r2)}) ÷ 2 = ${fmt(E.h)}`); } },
      { say: `Put ${fmt(E.h)} into the function.`, run: Z => { z(Z); Z.vline('m', E.h); Z.work(rowWork(E, E.h)); } },
      { say: `The vertex is ${pairT(E.h, E.k)}.`, run: Z => { z(Z); Z.vline('m', E.h); Z.dot(E.h, E.k); Z.point(E.h, E.k); Z.work(rowWork(E, E.h)); } }
    ];
  },
  axis: E => [
    { say: `Here ${M('a')} = ${fmt(E.A)} and ${M('b')} = ${fmt(E.B)}.`, run: () => {} },
    { say: 'The axis is x = −b ÷ 2a.', run: Z => Z.work(`<i>x</i> = ${MINUS}<i>b</i> ÷ 2<i>a</i>`) },
    { say: `−b is ${fmt(-E.B)}. 2a is ${fmt(2 * E.A)}.`, run: Z => Z.work(`${MINUS}(${fmt(E.B)}) = ${fmt(-E.B)} &nbsp;&nbsp; 2(${fmt(E.A)}) = ${fmt(2 * E.A)}`) },
    { say: `${fmt(-E.B)} ÷ ${fmtP(2 * E.A)} = ${fmt(E.h)}.`, run: Z => { Z.work(`<i>x</i> = ${fmt(-E.B)} ÷ ${fmtP(2 * E.A)} = ${fmt(E.h)}`); Z.vline('ax', E.h); Z.point(E.h, 0); } },
    { say: `The axis of symmetry is x = ${fmt(E.h)}.`, run: Z => { Z.vline('ax', E.h); Z.work(`Axis: <i>x</i> = ${fmt(E.h)}`); } }
  ],
  stdVertex: E => {
    const sub = `${substHTML(P(`${E.A}x^2+${E.B}x+${E.C}`), `(${fmt(E.h)})`)}`, done = rowWork(E, E.h);
    return [
      { say: `The axis is x = ${fmt(E.h)}.`, run: Z => Z.vline('ax', E.h) },
      { say: `Put ${fmt(E.h)} in for every x.`, run: Z => { Z.vline('ax', E.h); Z.work(sub); } },
      { say: 'Square first, then multiply, then add.', run: Z => { Z.vline('ax', E.h); Z.work(done); } },
      { say: `The vertex is ${pairT(E.h, E.k)}.`, run: Z => { Z.vline('ax', E.h); Z.dot(E.h, E.k); Z.point(E.h, E.k); Z.work(done); } }
    ];
  },
  table: E => {
    const near1 = E.xs.filter(x => !near(x, E.h)).sort((a, b) => Math.abs(a - E.h) - Math.abs(b - E.h) || b - a);
    const x1 = near1[0], m1 = 2 * E.h - x1, hasM = E.xs.some(x => near(x, m1));
    const base = Z => { Z.table(E.xs); Z.fill(E.h, E.k); Z.dot(E.h, E.k); };
    return [
      { say: `Center the table on the vertex, x = ${fmt(E.h)}.`, run: Z => { base(Z); Z.col(E.h); } },
      { say: `Try x = ${fmt(x1)}.`, run: Z => { base(Z); Z.col(x1); Z.work(rowWork(E, x1)); } },
      { say: `So ${fmt(x1)} gives ${dec(E.fn(x1))}.`, run: Z => { base(Z); Z.col(x1); Z.work(rowWork(E, x1)); Z.fill(x1, E.fn(x1)); } },
      ...(hasM ? [{ say: `Its mirror, ${fmt(m1)}, gives ${dec(E.fn(m1))} too.`, run: Z => { base(Z); Z.fill(x1, E.fn(x1)); Z.col(m1); Z.fill(m1, E.fn(m1)); } }] : []),
      { say: 'Same moves for the rest of the rows.', run: Z => { base(Z); E.xs.forEach(x => Z.fill(x, E.fn(x))); } }
    ];
  },
  plot: E => {
    const pts = E.xs.map(x => [x, E.fn(x)]), base = Z => { Z.table(E.xs); E.xs.forEach(x => Z.fill(x, E.fn(x))); };
    return [
      { say: 'Plot every row of the table.', run: async Z => { base(Z); await Z.dots(pts); } },
      { say: `Connect them: a U that opens ${E.up ? 'up' : 'down'}.`, run: async Z => { base(Z); Z.dots(pts, 'pt-u', 0); await Z.curve('main', E.fn); } }
    ];
  },
  domain: E => [
    { say: 'Domain: which x values can you use?', run: Z => Z.curve('main', E.fn) },
    { say: 'In a quadratic, any x works.', run: Z => { Z.curve('main', E.fn); Z.band(-10, 10); } },
    { say: 'Domain: (−∞, ∞).', run: Z => { Z.curve('main', E.fn); Z.work(`Domain: (${MINUS}∞, ∞)`); } }
  ],
  range: E => {
    const r = E.up ? ivT(E.k, Infinity, true) : ivT(-Infinity, E.k, false, true);
    const base = Z => { Z.curve('main', E.fn); Z.dot(E.h, E.k); };
    return [
      { say: `The vertex is ${pairT(E.h, E.k)}.`, run: Z => { base(Z); Z.point(E.h, E.k); } },
      { say: E.up ? `It opens up, so ${fmt(E.k)} is the lowest height.` : `It opens down, so ${fmt(E.k)} is the highest height.`, run: Z => { base(Z); Z.hline('k', E.k); } },
      { say: E.up ? 'From there it climbs forever.' : 'Below that it falls forever.', run: async Z => { base(Z); Z.hline('k', E.k); await Z.trace(E.fn, E.h, E.h + 3.5); } },
      { say: `It touches ${fmt(E.k)}: square bracket. ∞ always gets a round one.`, run: Z => { base(Z); Z.hline('k', E.k); Z.work(E.up ? `${hi('[')}${fmt(E.k)}, ∞${hi(')')}` : `${hi('(')}${NINF}, ${fmt(E.k)}${hi(']')}`); } },
      { say: `Range: ${r}.`, run: Z => { base(Z); Z.work(`Range: ${r}`); } }
    ];
  },
  maxmin: E => [
    { say: `${M('a')} is ${E.a > 0 ? 'positive' : 'negative'} here.`, run: () => {} },
    { say: `So the U opens ${E.up ? 'up' : 'down'}.`, run: Z => Z.curve('main', E.fn) },
    { say: `The vertex is the ${E.up ? 'bottom' : 'top'}: a ${E.up ? 'min' : 'max'}.`, run: Z => { Z.curve('main', E.fn); Z.dot(E.h, E.k); Z.point(E.h, E.k); } },
    { say: `${E.up ? 'Min' : 'Max'} at y = ${fmt(E.k)}.`, run: Z => { Z.curve('main', E.fn); Z.dot(E.h, E.k); Z.work(`${E.up ? 'Min' : 'Max'} at <i>y</i> = ${fmt(E.k)}`); } }
  ],
  incdec: E => {
    const inc = E.up ? ivT(E.h, Infinity) : ivT(-Infinity, E.h), dcr = E.up ? ivT(-Infinity, E.h) : ivT(E.h, Infinity);
    const base = Z => { Z.curve('main', E.fn); Z.dot(E.h, E.k); };
    return [
      { say: 'Read the graph left to right.', run: async Z => { base(Z); await Z.trace(E.fn, E.h - 3, E.h + 3, 3000); } },
      { say: `Left of x = ${fmt(E.h)} it ${E.up ? 'falls' : 'climbs'}.`, run: async Z => { base(Z); Z.band(-10, E.h); await Z.trace(E.fn, E.h - 3, E.h); } },
      { say: `Right of x = ${fmt(E.h)} it ${E.up ? 'climbs' : 'falls'}.`, run: async Z => { base(Z); Z.band(E.h, 10); await Z.trace(E.fn, E.h, E.h + 3); } },
      { say: `Increasing: ${inc}. Decreasing: ${dcr}.`, run: Z => { base(Z); Z.work(`Increasing: ${inc} &nbsp; Decreasing: ${dcr}`); } }
    ];
  },
  vertexAnswer: E => E.type === 'vertex' ? EXAMPLE.vertexForm(E) : E.type === 'intercept' ? EXAMPLE.zeros(E).concat(EXAMPLE.midVertex(E)) : EXAMPLE.axis(E).concat(EXAMPLE.stdVertex(E)),
  pwShape: (E, T) => {
    const pc = E.pieces[T.pi];
    const why = pc.kind === 'line' ? 'There’s an x but no square: a straight line.' : pc.pa < 0 ? 'Squared, with a minus in front: an upside-down U.' : 'Squared, nothing negative in front: a U.';
    return [
      { say: `Look at rule ${T.pi + 1}.`, run: () => {} },
      { say: why, run: async Z => { await Z.piece(pc); } }
    ];
  },
  pwTable: (E, T) => {
    const pc = E.pieces[T.pi], x0 = pc.xs[0], base = Z => Z.table(pc.xs);
    return [
      { say: `Rule ${T.pi + 1} owns ${condT(pc)}.`, run: Z => { base(Z); Z.band(isFinite(pc.lo) ? pc.lo : -10, isFinite(pc.hi) ? pc.hi : 10); } },
      { say: `Put each x into the rule. Try x = ${fmt(x0)}.`, run: Z => { base(Z); Z.col(x0); Z.work(pieceWork(pc, x0)); Z.fill(x0, pc.fn(x0)); } },
      { say: 'Same for the rest. Do the ends too.', run: Z => { base(Z); pc.xs.forEach(x => Z.fill(x, pc.fn(x))); } }
    ];
  },
  pwPlot: (E, T) => {
    const pc = E.pieces[T.pi], pts = pc.xs.map(x => [x, pc.fn(x)]);
    return [
      { say: 'Plot each row from that rule’s table.', run: async Z => { Z.table(pc.xs); pc.xs.forEach(x => Z.fill(x, pc.fn(x))); await Z.dots(pts); } },
      { say: 'Draw through them, only inside its x values.', run: async Z => { Z.dots(pts, 'pt-u', 0); await Z.piece(pc); } }
    ];
  },
  pwDots: (E, T) => {
    const pc = E.pieces[T.pi], ends = [[pc.lo, pc.loC], [pc.hi, pc.hiC]].filter(e => isFinite(e[0]));
    return [
      { say: `Rule ${T.pi + 1} is for ${condT(pc)}.`, run: async Z => { await Z.piece(pc); } },
      ...ends.map(([e, c], i) => ({ say: `At x = ${fmt(e)}: ${c ? '≤ or ≥ includes it — filled.' : '< or > leaves it out — open.'}`,
        run: async Z => { await Z.piece(pc); ends.slice(0, i + 1).forEach(([e2, c2]) => Z.dot(e2, pc.fn(e2), c2 ? 'dot-closed' : 'dot-open')); Z.point(e, pc.fn(e)); } })),
      ...(isFinite(pc.lo) && isFinite(pc.hi) ? [] : [{ say: 'The side with no end gets an arrow.', run: async Z => { await Z.piece(pc); pieceEnds(Z, pc); } }])
    ];
  },
  pwDomain: E => [
    { say: 'Domain: does every x have a rule?', run: async Z => { await drawPieces(Z, E); } },
    { say: 'Read the conditions in order. No gaps.', run: async Z => { await drawPieces(Z, E); Z.band(-10, 10); } },
    { say: 'Domain: (−∞, ∞).', run: async Z => { await drawPieces(Z, E); Z.work(`Domain: (${MINUS}∞, ∞)`); } }
  ],
  pwRange: E => {
    const [p1, , p3] = E.pieces;
    return [
      { say: 'Range: which heights does the graph reach?', run: async Z => { await drawPieces(Z, E); } },
      { say: 'The left piece falls forever.', run: async Z => { await drawPieces(Z, E); Z.point(p1.hi - 3.2, p1.fn(p1.hi - 3.2)); } },
      { say: 'The right piece climbs forever.', run: async Z => { await drawPieces(Z, E); const x = p3.lo + Math.min(2.5, (9.5 - p3.fn(p3.lo)) / p3.m); Z.point(x, p3.fn(x)); } },
      { say: 'They overlap, so every height is covered.', run: async Z => { await drawPieces(Z, E); Z.work(`Range: (${MINUS}∞, ∞)`); } }
    ];
  },
  pwOwner: (E, T) => {
    const x = E.evals[T.ei], oi = ownerOf(E, x), pc = E.pieces[oi], y = pc.fn(x);
    return [
      { say: `Which rule owns x = ${fmt(x)}?`, run: async Z => { await drawPieces(Z, E); Z.vline('ev', x); } },
      { say: `${condT(pc)} includes ${fmt(x)}. That’s rule ${oi + 1}.`, run: async Z => { await drawPieces(Z, E); Z.vline('ev', x); Z.point(x, y); } },
      { say: `Put ${fmt(x)} into rule ${oi + 1}.`, run: async Z => { await drawPieces(Z, E); Z.vline('ev', x); Z.point(x, y); Z.work(`${E.name}(${fmt(x)}) = ${pieceWork(pc, x)}`); } },
      { say: `So ${E.name}(${fmt(x)}) = ${dec(y)}.`, run: async Z => { await drawPieces(Z, E); Z.point(x, y); Z.work(`${E.name}(${fmt(x)}) = ${dec(y)}`); } }
    ];
  }
};
EXAMPLE.pwEval = EXAMPLE.pwOwner;

/* ---------- the mastery path ---------- */
const QIDS = ['q1', 'q2', 'q3', 'q4'];
const QINFO = {
  q1: { title: 'Vertex form', color: 'c4', form: 'Vertex form', twin: twinVertex },
  q2: { title: 'Intercept form', color: 'c3', form: 'Intercept form', twin: twinIntercept },
  q3: { title: 'Standard form', color: 'c1', form: 'Standard form', twin: twinStandard },
  q4: { title: 'Piecewise', color: 'c5', form: 'Piecewise', twin: twinPiecewise }
};
const MSTEPS = [
  { key: 'watch', name: 'Watch', tip: 'A slow, step-by-step walk-through of this exact question' },
  { key: 'together', name: 'Together', tip: 'This exact question, with help at every step' },
  { key: 'twin', name: 'Twin', tip: 'Same kind of question with new numbers, a bit less help' },
  { key: 'prove', name: 'Prove it', tip: 'New numbers, no hints. Every part right to master it.' }
];
function mastery() {
  const m = state.mastery = state.mastery || {};
  m.q = m.q || {};
  QIDS.forEach(id => (m.q[id] = m.q[id] || {}));
  m.sharp = m.sharp || 0;
  return m;
}
function nextUp() {
  const m = mastery();
  for (const id of QIDS) for (const s of MSTEPS) if (!m.q[id][s.key]) return { id, step: s.key };
  if (!m.final) return { final: true };
  return { sharp: true };
}
function nextLabel(n) {
  if (n.final) return 'Final quiz';
  if (n.sharp) return 'Keep sharp';
  return `Question ${QIDS.indexOf(n.id) + 1} · ${MSTEPS.find(s => s.key === n.step).name}`;
}
function goNext() { const n = nextUp(); if (n.final) startFinal(); else if (n.sharp) startSharp(); else startStep(n.id, n.step); }
function mLevel(id, extra) {
  const I = QINFO[id];
  return Object.assign({ unit: 2, kind: 'q', practice: true, graph: true, form: I.form, chapter: Object.assign({}, PCHAP, { c: I.color }) }, extra);
}
function startStep(id, step) {
  const num = QIDS.indexOf(id) + 1, S = MSTEPS.find(s => s.key === step);
  let run;
  if (step === 'watch') {
    run = ctx => {
      ctx.board.q(`Q${num}`, 'Watch it step by step. Pause or go back any time.');
      ctx.board.root.querySelector('.work').style.display = 'none';
      ponder(ctx, WATCH[id](), { onDone: () => ctx.finish(), doneLabel: 'Got it — next step', skip: () => ctx.finish(), skipLabel: 'Skip this walk-through' });
    };
  } else {
    const Q = step === 'together' ? QUIZ[id] : QINFO[id].twin();
    Q.label = step === 'together' ? `Q${num}` : step === 'twin' ? 'Twin' : 'Prove';
    const mode = step === 'together' ? 'guided' : step === 'twin' ? 'twin' : 'check';
    run = ctx => runQ(ctx, Q, mode);
  }
  openLevel(mLevel(id, { id: `u2m-${id}-${step}`, kind: step === 'watch' ? 'lesson' : 'q', title: `Question ${num} · ${S.name}`, eyebrow: `Master the quiz · step ${MSTEPS.indexOf(S) + 1} of 4`, run }),
    { onFinish: (stars, ctx) => stepDone(id, step, ctx) });
}
function resultCard(ctx, title, lede, buttons, extra) {
  const btns = buttons.map((b, i) => el('button', { class: 'btn ' + (i === 0 ? 'primary' : 'ghost'), type: 'button', onclick: b[1] }, b[0]));
  const card = el('div', { class: 'solved scr' }, el('h3', {}, title), el('p', { class: 'lede', html: lede }), extra || null, el('div', { class: 'actions' }, btns));
  ctx.panel.innerHTML = ''; ctx.panel.append(card);
  ctx.setSteps(0, 0);
  setTimeout(() => btns[0].focus({ preventScroll: true }), 40);
}
const slipList = ctx => ctx.slips && ctx.slips.length ? el('ul', { class: 'slips' }, ctx.slips.map(s => el('li', {}, s))) : null;
function stepDone(id, step, ctx) {
  const m = mastery(), num = QIDS.indexOf(id) + 1;
  if (step === 'prove' && ctx.mistakes > 0) {
    Sound.bad();
    return resultCard(ctx, 'Not mastered yet',
      `It has to be perfect to count. You slipped on ${ctx.slips.length === 1 ? 'this part' : 'these parts'}:`,
      [['Try another one', () => startStep(id, 'prove')], ['Practice a twin first', () => startStep(id, 'twin')], ['Watch it again', () => startStep(id, 'watch')]],
      slipList(ctx));
  }
  m.q[id][step] = true; save();
  Sound.win();
  if (step === 'prove') confetti();
  const n = nextUp();
  const title = step === 'prove' ? `Question ${num} mastered` : `${MSTEPS.find(s => s.key === step).name}: done`;
  const lede = step === 'prove' ? 'Every part right, with new numbers and no hints.'
    : step === 'watch' ? 'Now you do it, with help.'
    : ctx.mistakes ? 'Done. The parts you slipped on are worth one more look:' : 'Clean run.';
  resultCard(ctx, title, lede,
    [[`Next: ${nextLabel(n)} →`, goNext], ['Do it again', () => startStep(id, step)], ['Back to the map', showHome]],
    step !== 'prove' && step !== 'watch' ? slipList(ctx) : null);
}
function startFinal(i = 0, results = []) {
  const id = QIDS[i], Q = QUIZ[id];
  Q.label = `Q${i + 1}`;
  openLevel(mLevel(id, { id: 'u2m-final', title: `Final quiz · question ${i + 1} of 4`, eyebrow: 'Master the quiz · no hints', run: ctx => runQ(ctx, Q, 'check') }), {
    onFinish: (stars, ctx) => {
      results.push({ id, mistakes: ctx.mistakes, slips: ctx.slips.slice() });
      if (i < QIDS.length - 1) {
        return resultCard(ctx, `Question ${i + 1}: ${ctx.mistakes ? 'done, with slips' : 'perfect'}`, `On to question ${i + 2}.`,
          [[`Question ${i + 2} →`, () => startFinal(i + 1, results)]], slipList(ctx));
      }
      finalDone(ctx, results);
    }
  });
}
function finalDone(ctx, results) {
  const m = mastery(), perfect = results.every(r => !r.mistakes);
  if (perfect) { m.final = true; save(); Sound.win(); confetti(); }
  const list = el('ul', { class: 'slips' }, results.map((r, i) => el('li', {}, `Question ${i + 1}: ${r.mistakes ? 'slipped on ' + r.slips.join(', ') : 'perfect'}`)));
  const weak = results.filter(r => r.mistakes);
  resultCard(ctx, perfect ? 'You’ve mastered the quiz' : 'Almost there',
    perfect ? 'All four questions, every part right, no hints. You’re ready.' : 'It has to be perfect. Practice the ones you slipped on, then take it again.',
    perfect ? [['Keep sharp →', startSharp], ['Back to the map', showHome]]
      : [[`Practice question ${QIDS.indexOf(weak[0].id) + 1}`, () => startStep(weak[0].id, 'twin')], ['Take the final again', () => startFinal()], ['Back to the map', showHome]],
    list);
}
function startSharp() {
  const m = mastery(), id = QIDS[m.sharp % QIDS.length], Q = QINFO[id].twin();
  Q.label = 'Sharp';
  openLevel(mLevel(id, { id: 'u2m-sharp', title: `Keep sharp · ${QINFO[id].title}`, eyebrow: 'Master the quiz · no hints', run: ctx => runQ(ctx, Q, 'check') }), {
    onFinish: (stars, ctx) => {
      m.sharp++; save();
      const n = QINFO[QIDS[m.sharp % QIDS.length]];
      if (!ctx.mistakes) Sound.win();
      resultCard(ctx, ctx.mistakes ? 'Done, with slips' : 'Perfect', ctx.mistakes ? 'Worth another look:' : `Next up: ${n.title.toLowerCase()}, with new numbers.`,
        [[`Next: ${n.title} →`, startSharp], ['Back to the map', showHome]], slipList(ctx));
    }
  });
}
function masteryPanel() {
  const m = mastery(), n = nextUp();
  const cards = QIDS.map((id, i) => {
    const I = QINFO[id], done = m.q[id];
    return el('div', { class: 'mcard' + (done.prove ? ' mastered' : ''), style: `--cc:var(--${I.color});--cci:var(--${I.color}i)` },
      el('div', { class: 'mhead' }, el('b', {}, `Question ${i + 1}`), el('span', { class: 'formchip', style: `--fc:var(--${I.color})` }, I.form), done.prove ? el('span', { class: 'mok' }, '✓ mastered') : null),
      el('div', { class: 'mq m', html: QUIZ[id].html }),
      el('div', { class: 'mpills' }, MSTEPS.map(s => el('button', {
        class: 'mpill' + (done[s.key] ? ' done' : '') + (n.id === id && n.step === s.key ? ' next' : ''), type: 'button', title: s.tip,
        onclick: () => startStep(id, s.key) }, (done[s.key] ? '✓ ' : '') + s.name))));
  });
  const final = el('div', { class: 'mcard final' + (m.final ? ' mastered' : '') },
    el('div', { class: 'mhead' }, el('b', {}, 'Final quiz'), m.final ? el('span', { class: 'mok' }, '✓ mastered') : null),
    el('p', { class: 'muted' }, 'All four real quiz questions, no hints. Every part right means you’ve mastered it.'),
    el('div', { class: 'mpills' },
      el('button', { class: 'mpill' + (n.final ? ' next' : ''), type: 'button', onclick: () => startFinal() }, m.final ? 'Take it again' : 'Take the final quiz'),
      m.final ? el('button', { class: 'mpill' + (n.sharp ? ' next' : ''), type: 'button', onclick: startSharp }, `Keep sharp (${m.sharp} done)`) : null));
  return el('section', { class: 'mastery' },
    el('h2', {}, 'Master Quiz 2.1–2.2'),
    el('p', {}, 'Each question: watch it explained slowly, do it together, try a twin with new numbers, then prove it with no hints. Every step can be replayed.'),
    el('div', { class: 'mgrid' }, cards, final));
}
</script>

<script>
/* ======================= curriculum ======================= */
const U1_CHAPTERS = [

/* ======================= cheat sheet ======================= */
function buildRules() {
  const d = $('#drawer');
  const rule = (t, p) => el('div', { class: 'rule' }, el('h4', { html: t, style: 'font-size:16px;font-weight:700' }), el('p', { html: p }));
  d.innerHTML = '';
  d.append(el('div', { style: 'display:flex;align-items:center;justify-content:space-between' },
    el('h2', {}, 'Cheat sheet'),
    el('button', { class: 'iconbtn', type: 'button', 'aria-label': 'Close', onclick: toggleRules, html: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>' })));
  const sec = (c, title, rows) => { d.append(el('h3', { style: `--cci:var(--${c}i)`, html: title })); rows.forEach(r => d.append(rule(r[0], r[1]))); };
  sec('c1', 'Piecewise', [
    ['Pick the rule first', `Find which condition ${M('x')} satisfies, then substitute into that rule only.`],
    ['Boundaries', `${M('<=')} and ${M('>=')} include the endpoint (filled dot). ${M('<')} and ${M('>')} exclude it (hollow dot).`]
  ]);
  sec('c2', 'Composition', [
    ['Inside out', `${M('f(g(x))')} and ${M('(f o g)(x)')} are the same: ${M('g')} runs first.`],
    ['Substituting an expression', `Replace every ${M('x')} in the outer rule with the entire inner expression <b>in parentheses</b>, then expand.`],
    ['Squaring a binomial', `${M('(A + B)^2 = A^2 + 2AB + B^2')}. Never just ${M('A^2 + B^2')}.`]
  ]);
  sec('c3', 'Inverses', [
    ['Finding one', `Write ${M('y')}, swap ${M('x')} and ${M('y')}, solve for ${M('y')}.`],
    ['Points and graphs', `${M('(a, b)')} becomes ${M('(b, a)')}. The graphs mirror across ${M('y = x')}.`],
    ['Verifying', `Show both ${M('f(g(x)) = x')} and ${M('g(f(x)) = x')}.`]
  ]);
  sec('c4', 'Transformations', [
    ['Template', mh(`<span class="pa">a</span><i>f</i>(<span class="pb">b</span>(<i>x</i> ${MINUS} <span class="ph">h</span>)) + <span class="pk">k</span>`)],
    ['a — outside, vertical', `Negative reflects over the x-axis. ${M('|a| > 1')} stretches, ${M('|a| < 1')} compresses.`],
    ['b — inside, horizontal', `Negative reflects over the y-axis. ${M('|b| > 1')} compresses by ${M('1/|b|')}, ${M('|b| < 1')} stretches.`],
    ['h — inside, backwards', `${M('(x - h)')} moves right ${M('h')}. ${M('x + 4')} means ${M('h = -4')}, left 4.`],
    ['k — outside, honest', `${M('+ k')} up, ${M('- k')} down.`],
    ['Factor first', `If the inside reads ${M('bx + c')}, factor out ${M('b')} before reading ${M('h')}.`],
    ['Order', 'Reflect, then stretch or compress, then shift.'],
    ['Moving points', mh(`(<i>x</i>, <i>y</i>) → (<i>x</i> ÷ <span class="pb">b</span> + <span class="ph">h</span>, &nbsp;<span class="pa">a</span><i>y</i> + <span class="pk">k</span>)`)]
  ]);
  sec('c5', 'Sequences', [
    ['Explicit', `${M('a_n')} in terms of ${M('n')}. Plug in the position directly.`],
    ['Recursive', `${M('a_n')} in terms of earlier terms, plus a starting value. Build up one at a time.`],
    ['Sequence vs series', 'A sequence is the list. A series is the list added together.']
  ]);
  sec('c5', 'Unit 2 — reading graphs', [
    ['Increasing or decreasing', 'Read left to right. Climbing is increasing, falling is decreasing. It’s always about an interval, not the whole graph.'],
    ['Linear or not', 'Straight means a constant rate. If any part of the interval bends, that interval is non-linear.'],
    ['Corners', 'At a turning point the function is neither increasing nor decreasing, which is why those intervals use < and not ≤.'],
    ['Evaluating by eye', `${M('f(a)')} means: go to ${M('x = a')}, move straight up or down to the graph, read y. Nothing there means undefined.`],
    ['Stacked dots', 'A filled dot is included, an open dot is a hole. When both sit at the same x, the filled one is the value.'],
    ['Graph to rule', `Slope from two points, then ${M('y = mx + b')}. Dot end gives the boundary (filled → ≤ or ≥), arrow end gives none.`],
    ['Rule to graph', 'Shape first, then key points (both endpoints plus the vertex if it’s inside), then mark the dots and draw only across the interval.']
  ]);
  sec('c4', 'Unit 2 — quadratics', [
    ['Vertex form', mh('<i>y</i> = <span class="pa">a</span>(<i>x</i> − <span class="ph">h</span>)<sup>2</sup> + <span class="pk">k</span>') + ' — vertex is ' + mh('(<span class="ph">h</span>, <span class="pk">k</span>)') + ', and the sign of h flips when you read it.'],
    ['Standard form', mh('<i>y</i> = <i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i>') + ' — axis of symmetry ' + mh('<i>x</i> = −<span class="frac"><span><i>b</i></span><span>2<i>a</i></span></span>') + ', then substitute for y.'],
    ['Intercept form (factored)', mh('<i>y</i> = <span class="pa">a</span>(<i>x</i> − <i>p</i>)(<i>x</i> − <i>q</i>)') + ' — zeros are p and q, and the vertex sits halfway between them.'],
    ['What a does', 'Positive opens up (vertex is a minimum), negative opens down (maximum). ' + mh('|<i>a</i>| > 1') + ' narrower, ' + mh('|<i>a</i>| < 1') + ' wider.'],
    ['Domain and range', 'Domain is always ' + mh('(−∞, ∞)') + '. Range starts or stops at k: ' + mh('[<i>k</i>, ∞)') + ' opening up, ' + mh('(−∞, <i>k</i>]') + ' opening down.'],
    ['Intervals', 'Opening up: decreasing left of the vertex, increasing right of it. Opening down is the reverse. The vertex itself is in neither, so brackets stay round.'],
    ['To standard form', 'Expand the square or multiply the binomials first, then distribute the number out front to every term, then combine.']
  ]);
  sec('c6', 'Series and sums', [
    ['Sigma', `Bottom is where to start, top is where to stop, right side is the rule. Terms ${M('=')} top ${MINUS} bottom ${M('+ 1')}.`],
    ['Common difference', `${M('d = a_2 - a_1')}, and it must be the same for every pair.`],
    ['nth term', mh(`<i>a</i><sub><i>n</i></sub> = <i>a</i><sub>1</sub> + (<i>n</i> ${MINUS} 1)<i>d</i>`) + ' — gaps, not terms.'],
    ['Arithmetic sum', mh(`<i>S</i><sub><i>n</i></sub> = <span class="frac"><span><i>n</i></span><span>2</span></span>(<i>a</i><sub>1</sub> + <i>a</i><sub><i>n</i></sub>)`) + ' — find the last term first.']
  ]);
}
