<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>magicianstudy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--card:#181c2e;--ink:#eef0f8;--muted:#9aa2bd;--line:#2a3050}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:40px 16px;
  background-image:radial-gradient(circle at 20% 10%,#2172e833,transparent 40%),radial-gradient(circle at 85% 90%,#1f8a4c33,transparent 40%)}
main{width:100%;max-width:820px}
h1{font-size:clamp(44px,9vw,76px);font-weight:800;letter-spacing:-.04em;margin:0}
p.sub{color:var(--muted);font-size:18px;margin:8px 0 34px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:26px;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s;animation:in .6s cubic-bezier(.2,.8,.2,1) both}
a.card:nth-child(2){animation-delay:.1s}
a.card:hover{transform:translateY(-6px);border-color:var(--c)}
.tag{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
h2{font-size:32px;margin:6px 0 8px;letter-spacing:-.02em}
a.card p{color:var(--muted);margin:0;line-height:1.5}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){a.card{animation:none;transition:none}}
</style>
</head>
<body>
<main>
  <h1>magicianstudy</h1>
  <p class="sub">Pick a subject.</p>
  <div class="grid">
    <a class="card" href="algebra/" style="--c:#4f8ff7"><span class="tag">Algebra 2 Honors</span><h2>Algebraic</h2><p>Units 1 and 2, step by step, with a practice test and speed rounds.</p></a>
    <a class="card" href="chemistry/" style="--c:#2fb565"><span class="tag">Chemistry</span><h2>Periodic Study</h2><p>The first 36 elements, four at a time, learned with the song.</p></a>
  </div>
</main>
<script>if(location.protocol==='file:')document.querySelectorAll('a.card').forEach(a=>a.href+='index.html')</script>
</body>
</html>
